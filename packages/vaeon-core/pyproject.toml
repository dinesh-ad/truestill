[project]
name = "vaeon-core"
version = "0.1.0"
description = "Core library: categorize, date, de-duplicate and place media into a Category/YYYY/MM tree."
authors = [{ name = "vaeon contributors" }]
requires-python = ">=3.12"
readme = "README.md"
keywords = ["photos", "media", "organizer", "deduplication", "backup", "exif"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Archiving :: Backup",
    "Typing :: Typed",
]

# Metadata is read by shelling out to the `exiftool` binary (Ubuntu: libimage-exiftool-perl).
# Runtime Python deps are limited to perceptual hashing (imagehash on Pillow); SHA-256 and
# SQLite use the stdlib.
dependencies = [
    "imagehash>=4.3.1",
    "pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/dinesh-ad/vaeon"
Repository = "https://github.com/dinesh-ad/vaeon"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaeon_core"]
