[project]
name = "truestill-core"
version = "0.1.0"
description = "Core library: categorize, date, de-duplicate and place media into a Category/YYYY/MM tree."
authors = [{ name = "Truestill contributors" }]
# 3.14 because 3.13 leaves BUGFIX support in October 2026 - two years after its release, when
# "only security fixes are accepted and no more binaries are released" (devguide). The floor
# tracks what upstream still builds binaries for, not the last date a CVE would be patched.
# ⚠ This said 3.13 "to match what CI actually exercises"; CI has exercised BOTH since the 3.14
# leg was added, green on every run, which is what made the move a bump rather than a gamble.
requires-python = ">=3.14"
readme = "README.md"
license = "Apache-2.0"
keywords = ["photos", "media", "organizer", "deduplication", "backup", "exif"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Archiving :: Backup",
    "Typing :: Typed",
]

# Metadata is read by shelling out to the `exiftool` binary (Ubuntu: libimage-exiftool-perl).
# Runtime Python deps are limited to perceptual hashing (imagehash on Pillow); SHA-256 and
# SQLite use the stdlib.
dependencies = [
    # Only stdlib-unavailable need here: the three OS conventions for user data and
    # cache directories. Argued in writing at `app_paths.py` per ENGINEERING_STANDARD 4.
    "platformdirs>=4.11.0",
    "imagehash>=4.3.2",
    # Imported directly by `dedup.py` for the packed perceptual match, so it is declared
    # rather than leaned on transitively. Argued in §7 of IMPLEMENTATION_STANDARDS.md.
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "pillow-heif>=1.5.0",
    # Required, not probed. It was an optional import until 2026-08-04, and "optional" is what
    # made an absent trash backend a *destructive* state rather than a degraded one: with no
    # send2trash and no `gio`, `cleanup.trash_backend` returned None and folders were removed
    # outright. `gio` is a GLib tool, so that was the ordinary condition on Windows and macOS.
    # Pure `py3-none-any` wheel, BSD-3-Clause, no required dependencies of its own. Argued in
    # §7 of IMPLEMENTATION_STANDARDS.md.
    "send2trash>=2.1.0",
]

[project.urls]
Homepage = "https://github.com/dinesh-ad/truestill"
Repository = "https://github.com/dinesh-ad/truestill"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/truestill_core"]
