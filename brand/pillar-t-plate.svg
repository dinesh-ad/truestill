<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-label="Truestill T">
  <!-- THE MAINTAINER'S OWN ARTWORK, authored by him and taken verbatim on 2026-09-10.
       ⚠ EXACTLY ONE THING WAS CHANGED FROM WHAT HE SUPPLIED: the plate's flat `#968ae0` became
       the brand ramp, `#f43f5e` to `#fb923c`, corner to corner. The mark keeps `#161826`, the two
       eye holes stay, and no viewBox, transform or coordinate moved.
       ⚠ WHAT WAS HERE BEFORE WAS NOT HIS. It carried `viewBox="0 0 1100 1100"` and two long
       bezier paths reconstructed from a PROSE DESCRIPTION of this file - a different letterform
       that happened to answer the same description. Its geometry is gone and nothing should be
       recovered from it.
       THE MARK CARRIES ITS OWN CONTRAST, which is why the ramp is on the PLATE and the letter is
       dark rather than the other way round: `#161826` measures 4.79:1 on the rose stop and
       7.78:1 on the amber, so the artwork clears AA against its own ground at either end and does
       not borrow the rail's colour. `test_the_rail_mark_carries_its_own_contrast` holds the floor.
       IDS ARE NAMESPACED WHERE THIS IS INLINED. An inlined SVG shares the document's id space, so
       `truestill-plate-ramp` and `tsEyes` as authored here would collide the moment a second copy
       is inlined on one page; `index.html` renames both and `test_the_rail_artwork_matches_the_
       authored_source` compares the GEOMETRY, which is what must not drift. -->
  <defs>
    <linearGradient id="truestill-plate-ramp" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <mask id="tsEyes">
      <rect x="0" y="0" width="100" height="100" fill="#fff"/>
      <g transform="translate(16 14) scale(0.68)">
        <circle cx="34" cy="41" r="12" fill="#000"/>
        <circle cx="66" cy="41" r="12" fill="#000"/>
      </g>
    </mask>
  </defs>
  <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#truestill-plate-ramp)"/>
  <g mask="url(#tsEyes)">
    <g transform="translate(16 14) scale(0.68)">
      <path fill="none" stroke="#161826" stroke-width="32" stroke-linecap="round" d="M 25 25 L 75 25"/>
      <rect x="34" y="25" width="32" height="71" rx="16" fill="#161826"/>
      <circle cx="34" cy="41" r="16" fill="#161826"/>
      <circle cx="66" cy="41" r="16" fill="#161826"/>
    </g>
  </g>
</svg>
