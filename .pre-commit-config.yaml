# Run against staged changes with: uv run pre-commit run --all-files
# Install the git hook with:       uv run pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
        # Markdown too. `ruff format` formats python blocks *inside* markdown, so a docs-only
        # commit can pass this hook (default types are python/pyi only) and then fail
        # `make check`, which runs `ruff format --check .` over everything. That is exactly what
        # happened to b5cba4a. Widening the hook's file types closes the gap at the commit.
        types_or: [python, pyi, markdown]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        # Match the repo's strict config: every workspace member's src/, plus scripts/,
        # but not tests. Keep in step with `make typecheck` and the CI mypy step, which
        # cover exactly this set.
        files: ^(packages/(truestill-core|truestill-cli|truestill-app)/src/|scripts/)
        # Override the upstream default args, which are `--ignore-missing-imports
        # --scripts-are-modules`. The first silently answers "fine" to an import that cannot
        # be resolved -- which is precisely how `scripts/benchmark_hashing.py` kept importing
        # a module that had not existed since the vaeon -> truestill rename. Workspace
        # packages resolve via `mypy_path` in pyproject.toml; third-party stub gaps are
        # handled per-module there, not by a blanket flag.
        args: []
        # uvicorn was missing here and nothing noticed, because the blanket
        # --ignore-missing-imports above was answering for it.
        additional_dependencies: [imagehash, pillow, platformdirs, starlette, uvicorn]

  - repo: local
    hooks:
      - id: dash-style
        name: no em-dashes, and no mangled "word- word" dashes
        entry: python3 scripts/normalize_dashes.py --check
        language: system
        pass_filenames: false
        types_or: [python, markdown, toml, yaml]
      - id: product-name
        name: the product name is "Truestill" wherever a person reads it
        entry: python3 scripts/check_product_name.py
        language: system
        pass_filenames: false
        types_or: [python, markdown, toml, javascript, html]
      # Accidental ``> 25.9`` / ``-> 2024-03-24`` shell redirects land empty files at the root.
      # always_run so a previously committed artifact is caught even when untouched.
      - id: no-redirect-artifacts
        name: no shell-redirect artifact filenames at repo root
        entry: python3 scripts/check_redirect_artifacts.py
        language: system
        pass_filenames: false
        always_run: true

  # Non-negotiable project rule: no AI co-author trailer / Anthropic/Claude email in history.
  # Activate with: uv run pre-commit install --hook-type commit-msg
  - repo: local
    hooks:
      - id: no-ai-coauthor
        name: block AI co-author / Anthropic-Claude signature in commit message
        entry: python3 scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
      # The other direction of the closure rule. A letter that LEAVES BACKLOG.md must be
      # declared closed in this commit's message and must arrive in SHIPPED.md in the same
      # commit. It is a hook rather than a test because the corpus form is not honestly
      # checkable - 31 of SHIPPED.md's 32 entries predate the trailer, and a guard that goes
      # red on the past gets switched off. Reads only the staged diff, so it has no past.
      - id: entry-closure
        name: an entry that leaves the backlog is closed, and closed in this commit
        entry: python3 scripts/check_entry_closure.py
        language: system
        stages: [commit-msg]
      # §2's "a pending result outranks a ready batch" carries TWO obligations - contention (do
      # not cancel a run in flight) and OUTCOME (do not push onto a red one) - and only the first
      # was ever honoured, because nobody had separated them. Broken on 2026-08-21: three commits
      # landed on an already-red main. Refuses rather than waits, and
      # `TRUESTILL_PUSH_ANYWAY=1 git push` is how you say you mean it.
      # Activate with: uv run pre-commit install --hook-type pre-push
      - id: push-gate
        name: the last push's run is finished and green
        entry: python3 scripts/check_push_gate.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
