# Run against staged changes with: uv run pre-commit run --all-files
# Install the git hook with:       uv run pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        # Match the repo's strict config; only type the source packages, not tests.
        # Every workspace member's src/ is covered -- keep in step with `make typecheck`
        # and the CI mypy step, which type all three.
        files: ^packages/(truestill-core|truestill-cli|truestill-app)/src/
        additional_dependencies: [imagehash, pillow, starlette]

  # Non-negotiable project rule: no AI co-author trailer / Anthropic-Claude email in history.
  # Activate with: uv run pre-commit install --hook-type commit-msg
  - repo: local
    hooks:
      - id: no-ai-coauthor
        name: block AI co-author / Anthropic-Claude signature in commit message
        entry: python3 scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
