# ============================================================================================
# THE RELEASE LANE. Builds the frozen app for the platforms D9 publishes, PROVES IT CAN REPORT
# WHAT IT CONTAINS, signs the checksums with sigstore, and publishes.
#
# This is the first (aad) workflow that SHIPS rather than measures, and it is deliberately not
# the throwaway rig: that one answers questions, this one produces artifacts a person downloads.
#
# THE SELF-CHECK IS THE GATE, and that is the point of everything built for (aad) this month.
# A build that cannot report a real trash backend and its own typefaces DOES NOT PUBLISH - the
# two acceptance criteria stop being a thing we measured once and become a release control.
#
# BOTH PLATFORMS PRODUCE AN INSTALLABLE ARTIFACT: Windows an Inno Setup `.exe`, Linux a `.deb`,
# each built and then exercised here - installed, asked what it contains, removed, and checked
# that the user's catalog survived. Both BUNDLE the official exiftool distribution, verified
# against a pinned digest, so neither depends on what a user's machine happens to have. Linux
# still needs a perl interpreter, which every distribution ships and the self-check proves rather
# than assumes.
#
# `id-token: write` lives on the publish job ALONE. It is what sigstore keyless signing needs,
# GitHub refuses to issue it to pull-request runs from forks, and least privilege says the build
# matrix has no business holding it.
# ============================================================================================
name: release

on:
  push:
    tags: ["v*"]
  # So the lane can be EXERCISED without cutting a release. `dry_run` defaults to true, because
  # the alternative is that the first time anyone runs this, it publishes.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "build and verify, publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The two platforms D9 publishes. ⚠ This line used to add "macOS builds in CI (ci.yml)
        # and is not published" and that was simply false: `ci.yml` contains no PyInstaller step
        # and no freeze of any kind - grep it. NOTHING BUILDS A macOS ARTIFACT ANYWHERE in this
        # repository. D9 refuses to publish an unsigned macOS build because Gatekeeper refuses it
        # outright; what was never true is that one was being built at all.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # ⚠ THE FROZEN BUILD IS THE HALF NO TEST ON A DEVELOPER MACHINE TOUCHES. PyInstaller has
      # supported 3.14 since 6.15.0 (2025-08-03) and declares `<3.16,>=3.8`; that is a claim about
      # the bootloader, and only a `workflow_dispatch` dry run on both platforms turns it into
      # evidence. `DECISIONS.md` D13.
      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Sync workspace
        run: uv sync --all-packages --group dev --locked

      # VENDOR THE OFFICIAL DISTRIBUTION - ruled 2026-08-13, both platforms. A package
      # manager's build is not ours to rely on: chocolatey shipped a SHIM that resolved, was a
      # real .exe, and did nothing. This downloads exiftool's own release, verifies a pinned
      # SHA2-256, and stages the script/launcher WITH its module tree, which is what upstream's
      # README says must travel together.
      - name: Vendor exiftool
        run: uv run python packaging/exiftool_source.py exiftool-src

      # ⚠ THE BUNDLE, BUILT HERE, BEFORE PYINSTALLER - `(ajv)`. `static/dist/` is gitignored and
      # `--collect-data` copies what is on disk, so without these three steps the artifact
      # carries no `main.js`, the page 404s it, and the Organize result region never renders.
      # v0.1.0 shipped exactly that way, and the browser lane was green the whole time because
      # `make e2e` depends on `make frontend` and this job did not: the test and the release
      # built different things. `npm ci`, never `npm install`; `npm run build` is the ONE
      # definition the Makefile's `frontend` target also runs. `shell: bash` is present on the
      # Windows runner; GNU make is not promised there, which is why this does not go through it.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: packages/truestill-app/frontend/.nvmrc
          cache: npm
          cache-dependency-path: packages/truestill-app/frontend/package-lock.json

      - name: Build the React bundle
        shell: bash
        working-directory: packages/truestill-app/frontend
        run: |
          npm ci
          npm run build
          ls -la ../src/truestill_app/static/dist/

      # `--collect-data truestill_app` is REQUIRED, not decorative: without it the bundle carries
      # none of the app's data - no fonts, no notice, no templates, no app.js, no CSS - because
      # bundlers follow imports and a data file is imported by nothing. Measured 2026-08-12.
      # ⚠ `--copy-metadata` IS SEPARATE FROM `--collect-data` AND NEITHER IMPLIES THE OTHER.
      # `--collect-data` copies a package's DATA FILES; metadata is a `.dist-info` directory and
      # PyInstaller states plainly that it "does not collect these metadata files by default".
      # Without them `importlib.metadata` raises `PackageNotFoundError` inside the bundle,
      # `distribution_version` returns its fallback, and the settings screen reads
      # **"truestill unknown (not installed)"** on a working installed copy - which v0.1.0 and
      # v0.1.1 both shipped. `(ajw)`, measured on a local freeze 2026-09-04: control tree carried
      # `numpy` and `click` metadata (PyInstaller's own hooks put those there) and no
      # `truestill_*.dist-info` at all; with these two flags it carries both, at +4,946 bytes on
      # a 220.3 MiB tree.
      #
      # ⚠ **TWO DISTRIBUTIONS, NOT THREE, AND THAT IS MEASURED.** `truestill-cli` has ZERO
      # entries in this build's `Analysis-00.toc` and `PYZ-00.toc` - the frozen entry point is
      # `truestill_app/__main__.py` and nothing it imports reaches the CLI. Copying metadata for
      # code that is not in the bundle would ship a claim about something that is not there.
      #
      # ⚠ **NOT `--recursive-copy-metadata`**: it pulls in every dependency's metadata to serve
      # `importlib.metadata.requires`, which nothing here calls. `direct_url.json` inside a
      # `.dist-info` records the ABSOLUTE BUILD PATH of an editable install, so each one added is
      # a build-machine path shipped to users; two is the whole need.
      - name: Build (PyInstaller, Linux)
        if: runner.os == 'Linux'
        run: |
          uv run pyinstaller --noconfirm --clean --noconsole \
            --name truestill \
            --collect-data truestill_app \
            --copy-metadata truestill-app \
            --copy-metadata truestill-core \
            --add-data "exiftool-src/bin:bin" \
            packages/truestill-app/src/truestill_app/__main__.py

      # `--icon` IS ON THE WINDOWS STEP ALONE, AND NOT BY OVERSIGHT. PyInstaller 6.21.0 discards
      # it on Linux outright - `building/api.py`:
      #     if self.icon and not (is_win or is_darwin):
      #         logger.warning('Ignoring icon; supported only on Windows and macOS!')
      # Adding it above would log a warning and change nothing; the Linux mark is staged by
      # `packaging/build_deb.py` into the hicolor theme instead. `brand/favicon.ico` is used
      # BYTE-FOR-BYTE: `building/icon.py::normalize_icon_type` returns a `.ico` unchanged when
      # both its suffix and its magic header agree, so Pillow is never reached.
      - name: Build (PyInstaller, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv run pyinstaller --noconfirm --clean --noconsole `
            --name truestill `
            --icon brand/favicon.ico `
            --collect-data truestill_app `
            --copy-metadata truestill-app `
            --copy-metadata truestill-core `
            --add-data "exiftool-src/bin;bin" `
            packages/truestill-app/src/truestill_app/__main__.py

      # ═════════════════════════════════════════════════════════════════════════════════════
      # THE VERSION, DERIVED ONCE, FOR BOTH PLATFORMS. `(aex)`
      #
      # ⚠ THE QUESTION IS "IS THIS REF A VERSION TAG", NOT "IS THIS REF `main`". It was asked the
      # second way, separately on each platform, and both answers were wrong:
      #
      #   Linux    `[ "$version" != "main" ] || version="0.0.0"` - hardcoded ONE branch name, so a
      #            dispatch from any other branch stamped a package with that branch's name.
      #   Windows  `if (-not $version) { $version = '0.0.0-dev' }` - ⚠ A GUARD THAT CANNOT FIRE.
      #            `$version` is `github.ref_name` with a leading `v` stripped, and on a dispatch
      #            that is `main` - a NON-EMPTY string, so PowerShell's `-not` is false and the
      #            fallback is dead code. It reads as coverage and is not: it looks exactly like
      #            the Linux defence beside it and defends nothing. **A guard that cannot fire is
      #            worse than no guard**, because it stops anyone looking.
      #
      # Measured in run 32552435733 (dispatch, `dry_run=true`, from `main`): Linux produced
      # `truestill_0.0.0_amd64.deb` and Windows produced **`TruestillSetup-main.exe`** - an
      # installer stamped with a branch name, in the filename and in Add/Remove Programs - and it
      # **passed every gate**: self-check, comparison, install, verify, uninstall.
      #
      # ⚠ AND `0.0.0` WAS THE WRONG DISPATCH ANSWER TOO, revised before this shipped. It is the
      # QUIETER of the two defects: `truestill_0.0.0_amd64.deb` is indistinguishable from a real
      # 0.0.0 release, where `TruestillSetup-main.exe` is obviously broken. Something plausibly
      # wrong outlives something obviously wrong. A dispatch now stamps `0.0.0-dev.<run id>`.
      #
      # `shell: bash` on purpose: it is present on the Windows runner too, so ONE derivation
      # serves both platforms. Two derivations is how the two answers came to disagree.
      # ═════════════════════════════════════════════════════════════════════════════════════
      - name: Resolve the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # ⚠ ONE RULE, APPLIED TO BOTH BRANCHES: the value must be semver with THREE components.
          # Validation, not a fallback - which is the industry pattern and is what the first fix
          # got wrong. A fallback answers "what shall I use instead"; validation answers "is this
          # a version at all", and only the second can refuse.
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?(\+[0-9A-Za-z.]+)?$'

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # ⚠ NOT `0.0.0`. That is what the Linux half produced, and it is the QUIETER defect:
            # `truestill_0.0.0_amd64.deb` is indistinguishable from a real 0.0.0 release, where
            # Windows' `TruestillSetup-main.exe` is at least obviously broken. A dispatch build
            # must be unmistakable, so it carries `-dev` and the run that made it.
            # `packaging/installer.iss` already defaults to `0.0.0-dev`; the workflow ignored it.
            version="0.0.0-dev.${GITHUB_RUN_ID:-0}"
          fi

          if ! printf '%s' "${version}" | grep -Eq "${semver}"; then
            echo "::error::'${GITHUB_REF_NAME}' does not give a 3-component semver (got '${version}')." >&2
            echo "::error::Tag as vX.Y.Z. Refusing to guess - the publish job runs on tags." >&2
            exit 1
          fi

          echo "value=${version}" >> "$GITHUB_OUTPUT"

          # ⚠ THE TAG COMPARISON'S FLAG, DERIVED HERE AND NOWHERE ELSE. `compare_selfcheck.py`
          # always checks the artifact's version against the checkout's `pyproject.toml`; this
          # adds "and it must equal the tag", which only exists on a tag - a dispatch build is
          # `0.0.0-dev.<run id>` and could never equal the version in `pyproject.toml`. Three
          # steps interpolate this one string, because this file already learned what two
          # derivations of one answer cost: they came to disagree, and both were wrong. `(ajw)`
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "expect=--expect-version ${version}" >> "$GITHUB_OUTPUT"
          else
            echo "expect=" >> "$GITHUB_OUTPUT"
          fi
          echo "version resolved to ${version} (ref_type=${GITHUB_REF_TYPE}, ref_name=${GITHUB_REF_NAME})"

      # THE GATE. Not `continue-on-error`: an artifact that cannot say what it contains is not
      # one this project publishes.
      - name: Self-check the artifact
        shell: bash
        env:
          TRUESTILL_DATA_DIR: ${{ github.workspace }}/release-data
          TRUESTILL_CACHE_DIR: ${{ github.workspace }}/release-cache
        run: |
          mkdir -p findings
          if [ "$RUNNER_OS" = "Windows" ]; then
            exe="dist/truestill/truestill.exe"
          else
            exe="dist/truestill/truestill"
          fi
          set +e
          "$exe" --self-check "findings/selfcheck-${RUNNER_OS}.json"
          code=$?
          set -e
          echo "--- what the artifact reported (exit $code) ---"
          cat "findings/selfcheck-${RUNNER_OS}.json" || echo "no findings file was written"
          exit $code

      # The half the artifact cannot do: are those the bytes this repository built?
      - name: Compare the self-check against the repository
        shell: bash
        run: >-
          uv run python packaging/compare_selfcheck.py
          ${{ steps.version.outputs.expect }} findings/selfcheck-${RUNNER_OS}.json

      # THE MARK, ASSERTED ON THE BUILT EXECUTABLE rather than on the flag that was passed or on
      # the file in `brand/`. Both are one step short of the property - see verify_icon.py.
      - name: Verify the executable carries the mark
        if: runner.os == 'Windows'
        run: uv run python packaging/verify_icon.py --exe dist/truestill/truestill.exe

      # THE INSTALLER. The Linux half is the `.deb` step below; both are built here now.
      - name: Build the installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          Copy-Item packaging/installer.iss -Destination installer.iss
          & $iscc /DMyAppVersion=${{ steps.version.outputs.value }} installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited $LASTEXITCODE; there is no installer to ship" }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item inno-out/*.exe -Destination out/

      - name: Build the package (.deb)
        if: runner.os == 'Linux'
        run: |
          uv run python packaging/build_deb.py --dist dist/truestill \
            --version '${{ steps.version.outputs.value }}' --out out

      # Both sides, out of the package payload: the desktop entry names what is staged, and what
      # is staged hashes to the committed artwork. Neither half alone would catch an entry and a
      # tree that disagree.
      - name: Verify the package carries the mark
        if: runner.os == 'Linux'
        # `shell: bash` is `bash -eo pipefail`; the default `run:` shell is `bash -e` WITHOUT
        # pipefail, so `ls | head` read head's status and a missing package became `--deb ""`.
        shell: bash
        run: |
          # A glob, not `ls | head`: a substitution reports its OUTPUT, so a missing package was
          # `--deb ""` and the verdict belonged to whatever verify_icon does with an empty path.
          set -- out/truestill_*.deb
          test $# -eq 1 && test -f "$1" || { echo "::error::expected exactly one .deb in out/, found: $*"; exit 1; }
          uv run python packaging/verify_icon.py --deb "$1"

      # THE SAME DETECTOR AS WINDOWS, in the shape apt gives us. Install, ask the INSTALLED copy
      # what it contains, then remove it and check the catalog survived. `dpkg -i` is unattended
      # by nature, so the constraint that needed testing on Windows is free here.
      # BOUNDED, like its Windows twin. See that step's note: an unbounded step that hangs
      # discards the evidence you need when it finally fails.
      - name: Install, verify, uninstall (.deb)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo dpkg -i out/truestill_*.deb
          test -x /usr/bin/truestill || { echo '::error::no /usr/bin/truestill'; exit 1; }
          test -f /usr/share/applications/truestill.desktop || { echo '::error::no desktop entry'; exit 1; }
          # dpkg actually placed the mark where the entry's Icon= resolves. The payload check
          # above proves the package carries it; this proves installing it puts it there.
          test -f /usr/share/icons/hicolor/48x48/apps/truestill.png || {
            echo '::error::the desktop entry names an icon the install did not place'; exit 1; }

          # A stand-in for the user's catalog, in the directory the product resolves to.
          data="$HOME/.local/share/Truestill"
          mkdir -p "$data" && echo 'a user library index' > "$data/catalog.sqlite"

          mkdir -p findings
          /usr/bin/truestill --self-check findings/selfcheck-installed.json
          uv run python packaging/compare_selfcheck.py ${{ steps.version.outputs.expect }} findings/selfcheck-installed.json

          sudo dpkg -r truestill
          test ! -e /usr/lib/truestill || { echo '::error::the package left files behind'; exit 1; }
          test -f "$data/catalog.sqlite" || {
            echo '::error::REMOVING THE PACKAGE DELETED THE USER CATALOG'; exit 1; }
          echo 'package verified: installs, self-checks, removes, keeps the catalog'

      # THE DETECTOR. The self-check covers the bundle; until this step nothing covered the
      # INSTALLER. It exercises the installed product rather than the built folder:
      #   - /VERYSILENT is how the unattended constraint gets TESTED rather than assumed;
      #   - the self-check runs on the INSTALLED copy and is compared against this repository;
      #   - and a marker written into the data directory must SURVIVE the uninstall.
      # That last one is the point. An installer that deletes someone's catalog is the worst
      # possible last impression, and nothing here could notice it before.
      # ⚠ BOUNDED, AND THE BOUND IS THE LESSON RATHER THAN A PRECAUTION. This step once hung for
      # 30 minutes on a modal dialog nobody could click; GitHub's default is SIX HOURS, and
      # cancelling the run to reclaim the minutes discarded the step logs that would have named
      # the cause. A step that can hang indefinitely destroys the evidence at exactly the moment
      # it becomes valuable. Ten minutes is far above the observed cost of this step (~1 min) and
      # far below the point where a hang stops being informative.
      - name: Install, verify, uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: |
          $setup = Get-ChildItem out -Filter 'TruestillSetup-*.exe' | Select-Object -First 1
          # `Start-Process -Wait -PassThru`, NOT `& ... > $null` with `$LASTEXITCODE`: Setup.exe is a
          # GUI-subsystem program that re-launches itself, and whether pwsh waits for one - or sets
          # `$LASTEXITCODE` for it at all - is not promised. The first release dry run after
          # `f5bd967` added the check threw `the installer exited ` with an EMPTY code: the
          # status was read from a mechanism that never set it. `-Wait` and `.ExitCode` are.
          $run = Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "the installer exited $($run.ExitCode)" }
          Start-Sleep -Seconds 5

          $app = Join-Path $env:LOCALAPPDATA 'Programs\Truestill\truestill.exe'
          if (-not (Test-Path $app)) { throw "installed executable not found at $app" }
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Truestill\Truestill.lnk'
          if (-not (Test-Path $shortcut)) { throw "no Start-menu entry at $shortcut" }

          # The installed copy answers for itself, and the checkout decides whether those are the
          # bytes it built. Same pair as the build step, pointed at what a user actually gets.
          New-Item -ItemType Directory -Force -Path findings | Out-Null
          # The frozen exe is `--noconsole`, a GUI-subsystem program too; same mechanism.
          $run = Start-Process -FilePath $app -ArgumentList '--self-check','findings/selfcheck-installed.json' -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "the INSTALLED copy failed its own self-check (exit $($run.ExitCode))" }
          uv run python packaging/compare_selfcheck.py ${{ steps.version.outputs.expect }} findings/selfcheck-installed.json
          # ⚠ pwsh does not stop on a native command's exit code, and the runner exits on the LAST
          # $LASTEXITCODE only - so without this line a mismatch here was overwritten by the next
          # native call and could not fail the release (P188, 2026-09-02).
          if ($LASTEXITCODE -ne 0) { throw "the INSTALLED copy does not match the repository's self-check" }

          # The mark survived compression and install, asserted on the copy the user runs.
          uv run python packaging/verify_icon.py --exe $app
          if ($LASTEXITCODE -ne 0) { throw "the INSTALLED executable does not carry the mark" }

          # A stand-in for the user's catalog, in the directory the uninstall message promises to
          # leave alone.
          $data = Join-Path $env:LOCALAPPDATA 'Truestill'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $marker = Join-Path $data 'catalog.sqlite'
          Set-Content -Path $marker -Value 'a user library index' -Encoding utf8

          $uninstall = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs\Truestill') -Filter 'unins*.exe' |
            Select-Object -First 1
          $run = Start-Process -FilePath $uninstall.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "the uninstaller exited $($run.ExitCode)" }
          Start-Sleep -Seconds 5

          if (Test-Path $app) { throw 'the uninstaller left the program behind' }
          if (-not (Test-Path $marker)) {
            throw 'THE UNINSTALLER DELETED THE USER CATALOG - the promise its own message makes'
          }
          Write-Host 'installer verified: installs unattended, self-checks, uninstalls, keeps the catalog'

      - name: Archive
        shell: bash
        run: |
          mkdir -p out
          # ⚠ THE RESOLVED VERSION, NOT THE REF. `(aex)`, same class as the installer and the
          # .deb, found by reading the artefact list of the run that proved those two.
          #
          # It was `github.ref_name`, which is wrong in BOTH directions and only one of them is
          # obvious:
          #   * on a dispatch it produced `truestill-main-Linux.tar.gz` - a branch name in a
          #     distributable's filename, the defect this entry is about;
          #   * on a TAG it would produce `truestill-v1.2.3-Linux.tar.gz` - `v`-prefixed, beside
          #     `truestill_1.2.3_amd64.deb` and `TruestillSetup-1.2.3.exe` which are not. Three
          #     artefacts of one release disagreeing about their own version.
          #
          # This is CI-internal today, since the archive is uploaded rather than published - but
          # `gh release create out/*` in the publish job below ships whatever is in `out/`.
          name="truestill-${{ steps.version.outputs.value }}-${RUNNER_OS}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path dist/truestill/* -DestinationPath out/$name.zip"
          else
            tar -czf "out/$name.tar.gz" -C dist truestill
          fi
          ls -l out

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: |
            out/
            findings/
          retention-days: 7

  publish:
    name: sign and publish
    needs: build
    runs-on: ubuntu-latest
    # ⚠ **THIS `if` READS AS TWO GATES AND IS ONE, ON THE PATH THAT MATTERS.** The second clause
    # is real on a **dispatch** - `github.event.inputs.dry_run` is a STRING there, so it is
    # compared as one rather than by truthiness. On a **tag push there are no inputs at all**:
    # the expression is `null != 'true'`, which is TRUE. So the tag path's only condition is
    # *"is this a v-tag"*, and **pushing the tag IS the entire authorisation**.
    #
    # On a public repository that means one mistyped `v1.0.0` publishes a visible, latest-marked
    # release with nothing to confirm it. Measured rather than reasoned: P152's rehearsal reached
    # `gh release create` on a tag push and **relied on this hole being open** to do it.
    #
    # 🔑 It is the same class this file already documents about the Windows version fallback -
    # *"a guard that cannot fire is worse than no guard, because it stops anyone looking"* - and
    # here the careful comment about dispatch strings made the tag-path hole **less** visible.
    #
    # **THE SECOND GATE IS A HUMAN, AND IT HAS TO BE.** `environment: release` carries a
    # `required_reviewers` rule, so this job enters `Waiting` and runs **no step** - nothing
    # downloaded, nothing signed, nothing published - until a reviewer approves in the Actions
    # UI. An unintended tag costs a pending approval that is then rejected.
    #
    # ⚠ **THE YAML LINE ALONE IS NOT THE GUARD, and that trap is why this is spelled out.**
    # GitHub creates an environment named here **implicitly, with no protection rules**, if one
    # does not exist - which would look exactly like this and gate nothing. The rule lives in
    # repository settings and is verified with:
    #     gh api "repos/$(gh repo view --json nameWithOwner -q .nameWithOwner)/environments/release" \
    #       -q '.protection_rules'
    #
    # **Refused: a tag-name pattern excluding prereleases.** It filters the harmless case and
    # passes the harmful one - the dangerous tag is a *well-formed* `v1.0.0` pushed early.
    # **Refused: an in-repo gate** (a RELEASING file, a CHANGELOG version match). It is evaluated
    # by the same unattended automation, and the failure being closed is *nobody decided*.
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
    environment: release
    permissions:
      contents: write # create the release
      id-token: write # the OIDC token sigstore signs with
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true

      # `out/` is published as-is, and TWO steps here assume it holds regular files: this one and
      # `gh release create out/*` below. `sha256sum` exits 1 on a directory, and `run:` is
      # `bash -e`, so one stray directory fails the release AFTER the whole build matrix has spent
      # its minutes - and says only "Is a directory". `packaging/build_deb.py` staging into `out/`
      # was that directory until 2026-08-15. The producer is fixed; this names anything that gets
      # in there next, instead of dying on it.
      - name: Checksums
        run: |
          cd out
          for entry in *; do
            [ -f "$entry" ] || {
              echo "::error::out/ is published as-is and holds a non-file: $entry"; exit 1; }
          done
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # KEYLESS. No certificate, no key, no fee: Fulcio issues an ephemeral certificate against
      # this workflow's OIDC identity and Rekor logs the entry. The bundle carries signature,
      # certificate and log entry together, so a verifier needs only the bundle and the file.
      # ONE file is signed - the checksums - because that transitively covers every artifact and
      # gives a user one command to run rather than one per download.
      - uses: sigstore/cosign-installer@v4.1.0

      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle out/SHA256SUMS.sigstore.json out/SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" out/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes "**Verify before installing.** The checksums below are signed with
          [sigstore](https://www.sigstore.dev/) - keyless, so there is no certificate to trust and
          no key for anyone to steal. Both commands run where you downloaded the files:

              sha256sum --check --ignore-missing SHA256SUMS

              cosign verify-blob \\
                --bundle SHA256SUMS.sigstore.json \\
                --certificate-identity-regexp '^https://github[.]com/${{ github.repository }}/[.]github/workflows/release[.]yml@' \\
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
                SHA256SUMS

          The second proves the checksums were produced by this repository's own release workflow.
          \`cosign\` is at https://github.com/sigstore/cosign. On Windows use \`certutil -hashfile
          <file> SHA256\` in place of \`sha256sum\`.

          **Windows.** These builds are not code-signed (\`DECISIONS.md\` D9), so Windows shows a
          SmartScreen warning - **when you launch the installer, before anything is installed**,
          and again the first time you run the app from the portable zip. Choose **More info**
          then **Run anyway**. The warning is reputation-based per file and clears as downloads
          accrue.

          **macOS is not published.** Gatekeeper refuses unsigned applications outright rather
          than warning, so an unsigned build would be one most people could not open. Windows and
          Linux only for now.

          **Linux.** No gate of any kind - the \`.deb\` installs and runs."
