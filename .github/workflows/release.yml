# ============================================================================================
# THE RELEASE LANE. Builds the frozen app for the platforms D9 publishes, PROVES IT CAN REPORT
# WHAT IT CONTAINS, signs the checksums with sigstore, and publishes.
#
# This is the first (aad) workflow that SHIPS rather than measures, and it is deliberately not
# the throwaway rig: that one answers questions, this one produces artifacts a person downloads.
#
# THE SELF-CHECK IS THE GATE, and that is the point of everything built for (aad) this month.
# A build that cannot report a real trash backend and its own typefaces DOES NOT PUBLISH - the
# two acceptance criteria stop being a thing we measured once and become a release control.
#
# BOTH PLATFORMS PRODUCE AN INSTALLABLE ARTIFACT: Windows an Inno Setup `.exe`, Linux a `.deb`,
# each built and then exercised here - installed, asked what it contains, removed, and checked
# that the user's catalog survived. Both BUNDLE the official exiftool distribution, verified
# against a pinned digest, so neither depends on what a user's machine happens to have. Linux
# still needs a perl interpreter, which every distribution ships and the self-check proves rather
# than assumes.
#
# `id-token: write` lives on the publish job ALONE. It is what sigstore keyless signing needs,
# GitHub refuses to issue it to pull-request runs from forks, and least privilege says the build
# matrix has no business holding it.
# ============================================================================================
name: release

on:
  push:
    tags: ["v*"]
  # So the lane can be EXERCISED without cutting a release. `dry_run` defaults to true, because
  # the alternative is that the first time anyone runs this, it publishes.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "build and verify, publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The two platforms D9 publishes. ⚠ This line used to add "macOS builds in CI (ci.yml)
        # and is not published" and that was simply false: `ci.yml` contains no PyInstaller step
        # and no freeze of any kind - grep it. NOTHING BUILDS A macOS ARTIFACT ANYWHERE in this
        # repository. D9 refuses to publish an unsigned macOS build because Gatekeeper refuses it
        # outright; what was never true is that one was being built at all.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Sync workspace
        run: uv sync --all-packages --group dev --locked

      # VENDOR THE OFFICIAL DISTRIBUTION - ruled 2026-08-13, both platforms. A package
      # manager's build is not ours to rely on: chocolatey shipped a SHIM that resolved, was a
      # real .exe, and did nothing. This downloads exiftool's own release, verifies a pinned
      # SHA2-256, and stages the script/launcher WITH its module tree, which is what upstream's
      # README says must travel together.
      - name: Vendor exiftool
        run: uv run python packaging/exiftool_source.py exiftool-src

      # `--collect-data truestill_app` is REQUIRED, not decorative: without it the bundle carries
      # none of the app's data - no fonts, no notice, no templates, no app.js, no CSS - because
      # bundlers follow imports and a data file is imported by nothing. Measured 2026-08-12.
      - name: Build (PyInstaller, Linux)
        if: runner.os == 'Linux'
        run: |
          uv run pyinstaller --noconfirm --clean --noconsole \
            --name truestill \
            --collect-data truestill_app \
            --add-data "exiftool-src/bin:bin" \
            packages/truestill-app/src/truestill_app/__main__.py

      # `--icon` IS ON THE WINDOWS STEP ALONE, AND NOT BY OVERSIGHT. PyInstaller 6.21.0 discards
      # it on Linux outright - `building/api.py`:
      #     if self.icon and not (is_win or is_darwin):
      #         logger.warning('Ignoring icon; supported only on Windows and macOS!')
      # Adding it above would log a warning and change nothing; the Linux mark is staged by
      # `packaging/build_deb.py` into the hicolor theme instead. `brand/favicon.ico` is used
      # BYTE-FOR-BYTE: `building/icon.py::normalize_icon_type` returns a `.ico` unchanged when
      # both its suffix and its magic header agree, so Pillow is never reached.
      - name: Build (PyInstaller, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv run pyinstaller --noconfirm --clean --noconsole `
            --name truestill `
            --icon brand/favicon.ico `
            --collect-data truestill_app `
            --add-data "exiftool-src/bin;bin" `
            packages/truestill-app/src/truestill_app/__main__.py

      # THE GATE. Not `continue-on-error`: an artifact that cannot say what it contains is not
      # one this project publishes.
      - name: Self-check the artifact
        shell: bash
        env:
          TRUESTILL_DATA_DIR: ${{ github.workspace }}/release-data
          TRUESTILL_CACHE_DIR: ${{ github.workspace }}/release-cache
        run: |
          mkdir -p findings
          if [ "$RUNNER_OS" = "Windows" ]; then
            exe="dist/truestill/truestill.exe"
          else
            exe="dist/truestill/truestill"
          fi
          set +e
          "$exe" --self-check "findings/selfcheck-${RUNNER_OS}.json"
          code=$?
          set -e
          echo "--- what the artifact reported (exit $code) ---"
          cat "findings/selfcheck-${RUNNER_OS}.json" || echo "no findings file was written"
          exit $code

      # The half the artifact cannot do: are those the bytes this repository built?
      - name: Compare the self-check against the repository
        shell: bash
        run: uv run python packaging/compare_selfcheck.py findings/selfcheck-${RUNNER_OS}.json

      # THE MARK, ASSERTED ON THE BUILT EXECUTABLE rather than on the flag that was passed or on
      # the file in `brand/`. Both are one step short of the property - see verify_icon.py.
      - name: Verify the executable carries the mark
        if: runner.os == 'Windows'
        run: uv run python packaging/verify_icon.py --exe dist/truestill/truestill.exe

      # THE INSTALLER. The Linux half is the `.deb` step below; both are built here now.
      - name: Build the installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          $version = '${{ github.ref_name }}' -replace '^v', ''
          if (-not $version) { $version = '0.0.0-dev' }
          Copy-Item packaging/installer.iss -Destination installer.iss
          & $iscc /DMyAppVersion=$version installer.iss
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item inno-out/*.exe -Destination out/

      - name: Build the package (.deb)
        if: runner.os == 'Linux'
        run: |
          version="$(echo '${{ github.ref_name }}' | sed 's/^v//')"
          [ -n "$version" ] && [ "$version" != "main" ] || version="0.0.0"
          uv run python packaging/build_deb.py --dist dist/truestill --version "$version" --out out

      # Both sides, out of the package payload: the desktop entry names what is staged, and what
      # is staged hashes to the committed artwork. Neither half alone would catch an entry and a
      # tree that disagree.
      - name: Verify the package carries the mark
        if: runner.os == 'Linux'
        run: uv run python packaging/verify_icon.py --deb "$(ls out/truestill_*.deb | head -1)"

      # THE SAME DETECTOR AS WINDOWS, in the shape apt gives us. Install, ask the INSTALLED copy
      # what it contains, then remove it and check the catalog survived. `dpkg -i` is unattended
      # by nature, so the constraint that needed testing on Windows is free here.
      # BOUNDED, like its Windows twin. See that step's note: an unbounded step that hangs
      # discards the evidence you need when it finally fails.
      - name: Install, verify, uninstall (.deb)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo dpkg -i out/truestill_*.deb
          test -x /usr/bin/truestill || { echo '::error::no /usr/bin/truestill'; exit 1; }
          test -f /usr/share/applications/truestill.desktop || { echo '::error::no desktop entry'; exit 1; }
          # dpkg actually placed the mark where the entry's Icon= resolves. The payload check
          # above proves the package carries it; this proves installing it puts it there.
          test -f /usr/share/icons/hicolor/48x48/apps/truestill.png || {
            echo '::error::the desktop entry names an icon the install did not place'; exit 1; }

          # A stand-in for the user's catalog, in the directory the product resolves to.
          data="$HOME/.local/share/Truestill"
          mkdir -p "$data" && echo 'a user library index' > "$data/catalog.sqlite"

          mkdir -p findings
          /usr/bin/truestill --self-check findings/selfcheck-installed.json
          uv run python packaging/compare_selfcheck.py findings/selfcheck-installed.json

          sudo dpkg -r truestill
          test ! -e /usr/lib/truestill || { echo '::error::the package left files behind'; exit 1; }
          test -f "$data/catalog.sqlite" || {
            echo '::error::REMOVING THE PACKAGE DELETED THE USER CATALOG'; exit 1; }
          echo 'package verified: installs, self-checks, removes, keeps the catalog'

      # THE DETECTOR. The self-check covers the bundle; until this step nothing covered the
      # INSTALLER. It exercises the installed product rather than the built folder:
      #   - /VERYSILENT is how the unattended constraint gets TESTED rather than assumed;
      #   - the self-check runs on the INSTALLED copy and is compared against this repository;
      #   - and a marker written into the data directory must SURVIVE the uninstall.
      # That last one is the point. An installer that deletes someone's catalog is the worst
      # possible last impression, and nothing here could notice it before.
      # ⚠ BOUNDED, AND THE BOUND IS THE LESSON RATHER THAN A PRECAUTION. This step once hung for
      # 30 minutes on a modal dialog nobody could click; GitHub's default is SIX HOURS, and
      # cancelling the run to reclaim the minutes discarded the step logs that would have named
      # the cause. A step that can hang indefinitely destroys the evidence at exactly the moment
      # it becomes valuable. Ten minutes is far above the observed cost of this step (~1 min) and
      # far below the point where a hang stops being informative.
      - name: Install, verify, uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: |
          $setup = Get-ChildItem out -Filter 'TruestillSetup-*.exe' | Select-Object -First 1
          & $setup.FullName /VERYSILENT /SUPPRESSMSGBOXES /NORESTART | Out-Null
          Start-Sleep -Seconds 5

          $app = Join-Path $env:LOCALAPPDATA 'Programs\Truestill\truestill.exe'
          if (-not (Test-Path $app)) { throw "installed executable not found at $app" }
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Truestill\Truestill.lnk'
          if (-not (Test-Path $shortcut)) { throw "no Start-menu entry at $shortcut" }

          # The installed copy answers for itself, and the checkout decides whether those are the
          # bytes it built. Same pair as the build step, pointed at what a user actually gets.
          New-Item -ItemType Directory -Force -Path findings | Out-Null
          & $app --self-check findings/selfcheck-installed.json
          if ($LASTEXITCODE -ne 0) { throw "the INSTALLED copy failed its own self-check" }
          uv run python packaging/compare_selfcheck.py findings/selfcheck-installed.json

          # The mark survived compression and install, asserted on the copy the user runs.
          uv run python packaging/verify_icon.py --exe $app
          if ($LASTEXITCODE -ne 0) { throw "the INSTALLED executable does not carry the mark" }

          # A stand-in for the user's catalog, in the directory the uninstall message promises to
          # leave alone.
          $data = Join-Path $env:LOCALAPPDATA 'Truestill'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $marker = Join-Path $data 'catalog.sqlite'
          Set-Content -Path $marker -Value 'a user library index' -Encoding utf8

          $uninstall = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs\Truestill') -Filter 'unins*.exe' |
            Select-Object -First 1
          & $uninstall.FullName /VERYSILENT /SUPPRESSMSGBOXES /NORESTART | Out-Null
          Start-Sleep -Seconds 5

          if (Test-Path $app) { throw 'the uninstaller left the program behind' }
          if (-not (Test-Path $marker)) {
            throw 'THE UNINSTALLER DELETED THE USER CATALOG - the promise its own message makes'
          }
          Write-Host 'installer verified: installs unattended, self-checks, uninstalls, keeps the catalog'

      - name: Archive
        shell: bash
        run: |
          mkdir -p out
          name="truestill-${{ github.ref_name }}-${RUNNER_OS}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path dist/truestill/* -DestinationPath out/$name.zip"
          else
            tar -czf "out/$name.tar.gz" -C dist truestill
          fi
          ls -l out

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: |
            out/
            findings/
          retention-days: 7

  publish:
    name: sign and publish
    needs: build
    runs-on: ubuntu-latest
    # A tag, and never a dry run. `github.event.inputs.dry_run` is a STRING on dispatch, so it is
    # compared as one - `!= 'true'` rather than a truthiness test that would treat "false" as true.
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
    permissions:
      contents: write # create the release
      id-token: write # the OIDC token sigstore signs with
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true

      - name: Checksums
        run: |
          cd out
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # KEYLESS. No certificate, no key, no fee: Fulcio issues an ephemeral certificate against
      # this workflow's OIDC identity and Rekor logs the entry. The bundle carries signature,
      # certificate and log entry together, so a verifier needs only the bundle and the file.
      # ONE file is signed - the checksums - because that transitively covers every artifact and
      # gives a user one command to run rather than one per download.
      - uses: sigstore/cosign-installer@v4.1.0

      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle out/SHA256SUMS.sigstore.json out/SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" out/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes "Verify before installing - see the Verifying a download section of the README.

          Windows will show a SmartScreen warning on first run: these builds are not code-signed
          (\`DECISIONS.md\` D9). Choose **More info** then **Run anyway**. The warning clears as
          downloads accrue."
