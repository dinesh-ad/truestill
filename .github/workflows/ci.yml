name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly. Two things ride this trigger: the collection-order pass (see the step's own comment
  # for the cost that moved it here) and, since 2026-08-22, the browser lane. 03:17 rather than on
  # the hour: GitHub's scheduler queues heavily at :00.
  schedule:
    - cron: "17 3 * * *"
  # ⚠ Added 2026-08-22 so the browser lane can be run ON PURPOSE - before a tag, or after a change
  # that reaches a screen. Without it the only way to run `e2e` in CI was to wait for 03:17.
  workflow_dispatch:
    inputs:
      # MEASURING THE LANE WITHOUT EDITING THE LANE. `(ajx)` asks whether the browser lane can be
      # brought under the ~8 minute condition, and the only untried lever is `-n auto`. Answering
      # that needed a run of one engine, in parallel, on CI hardware - which previously meant
      # committing a change to the `E2E` step, dispatching, reading it, and reverting: three
      # commits of churn for a number, and a step that has been edited for an experiment is a step
      # somebody forgets to put back.
      #
      # Empty by default, so a scheduled or ordinary dispatch is byte-for-byte the run it always
      # was. `make e2e` already accepts `E2E_EXTRA`; this exposes it, nothing more.
      # Example: `-n auto -k webkit` runs the 477 webkit cases in parallel and deselects the rest.
      e2e_extra:
        description: "extra pytest args for the e2e lane (empty = the ordinary lane)"
        required: false
        default: ""

# The event is part of the group ON PURPOSE. Without it a scheduled run and a push to main share
# `refs/heads/main`, so the first morning push would cancel the nightly mid-flight - and the one
# thing the nightly exists to run is the one thing no other trigger runs. A guard that is
# silently cancelled is worse than one that was never scheduled, because the calendar says it ran.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # ⚠ ONE JOB DEFINITION, TWO INTERPRETERS - NOT A SECOND COPY OF THIS LANE. The 3.14 leg is
    # the `python` matrix dimension below, so every step, bound, cache key and workaround here is
    # shared by construction. A duplicated `check-314:` job would be §4's fifty-sixth member with
    # a schedule: the next apt drop-in, Defender exclusion or timing probe would land in one of
    # them and the other would drift silently while both stayed green.
    #
    # `continue-on-error` is read from the matrix, which is GitHub's documented pattern for
    # marking a leg allowed-to-fail. ⚠ It is `false` for every leg now that 3.14 is adopted -
    # kept matrix-driven rather than deleted, because the next unadopted interpreter (3.15 lands
    # 2026-10-01) wants exactly this shape again, and rebuilding it is how the gate gets
    # hard-coded to `true` by someone in a hurry.
    continue-on-error: ${{ matrix.experimental }}
    # ⚠ WITHOUT THIS THE DEFAULT IS SIX HOURS, and on 2026-08-19 that was not theoretical: run
    # 32279378834 sat 33+ minutes in `apt-get update` against a mirror that was not answering,
    # with nothing to stop it. The other two lanes had already finished in 1m07s and 3m02s.
    # 20 is roughly 6x the slowest legitimate run of this job (Windows, ~3 min), so it is
    # headroom rather than a target - a hang fails fast and visibly, a slow day does not.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # ⚠ 3.14 IS NOW THE GATE, not evidence. It was an allowed-to-fail leg from 2026-08-21 to
        # 2026-08-22 and was green on every run in between, which is what made the move a bump
        # rather than a gamble - the two platforms nobody here can run had already reported.
        #
        # **3.13 is gone rather than demoted.** `requires-python` is `>=3.14`, so a 3.13 leg could
        # not `uv sync` at all: it would fail for the reason the floor moved, which is not a
        # signal. A version this project refuses to install is not a lane.
        #
        # 3.13 leaves BUGFIX support in October 2026 - "after two years, only security fixes are
        # accepted and no more binaries are released" (devguide). See `DECISIONS.md` D13.
        python: ["3.14"]
        include:
          - python: "3.14"
            experimental: false
    # Set once for the job so every `uv sync` and `uv run` below picks the matrix interpreter.
    # Per-step `--python` flags would be the drift this matrix exists to prevent: a step added
    # later would inherit the default and quietly test 3.13 inside the 3.14 leg.
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      # ⚠ DEPTH 1, THE ACTION'S DEFAULT, AND A DECISION RATHER THAN AN OVERSIGHT (P189, 2026-09-02).
      # `test_closed_entries_leave_the_backlog.py` reads closure trailers out of `git log`; at depth
      # 1 it read one commit and passed over an empty set, and it now SKIPS here with that reason.
      # A full checkout (`fetch-depth: 0`) would make it real in CI at ~170 MB per lane per push
      # (the pack is 169 MiB). Whether that is worth it is the maintainer's call; `(ajs)` carries it.
      - uses: actions/checkout@v7

      # ⚠ THE BOUND LIVES IN apt's CONFIG, NOT ON OUR apt COMMANDS, AND THAT IS THE FIX.
      #
      # It was flags on `Install exiftool (Linux)` for about an hour on 2026-08-19, which bounded
      # the one call site anyone was looking at. Run 32295312064 caught the rest during a live
      # outage: this job's OWN exiftool step still had the defaults, and `playwright install
      # --with-deps` shells out to `apt-get` INTERNALLY, where no flag of ours can reach. That
      # third one spent 37+ minutes on a mirror that was not answering.
      #
      # ⚠ `ForceIPv4` TREATS THE TRIGGER, NOT THE DEADLOCK, AND THAT DISTINCTION IS THE POINT.
      # The hang is apt LP#2003851, a per-process queue deadlock that no Acquire setting bounds;
      # `scripts/ci_bounded.sh` is what actually contains it. The bug report records that on
      # dual-stack hosts with no IPv6 routing - the ordinary Azure-hosted runner - forcing IPv4
      # "eliminates the trigger completely". So this makes the 503 less likely to arrive; it does
      # NOT make the deadlock survivable. Kept because it is one line and free, and recorded as a
      # trigger-level mitigation so nobody later reads it as the fix.
      #
      # A drop-in is inherited by every apt invocation in the job - ours, Playwright's, and
      # whatever gets added next - so the setting is chosen once instead of re-applied per call.
      # `test_ci_bounds_apt_in_one_place` keeps it that way.
      #
      # WHY THESE VALUES, AND THEY ARE THE OPPOSITE OF THE STANDARD CI ADVICE: apt >= 2.3.2
      # already defaults to `Acquire::Retries=3` at a 120 s timeout, and the failing logs show
      # exactly those four rounds per index. The runner images resolve through a mirrorlist whose
      # fallback to `archive.ubuntu.com` WORKS - the cost is only in reaching it. So asking three
      # more times is the expense, not the remedy; a mirror that is DOWN is not made reachable by
      # asking it four times, and the retry that helps a genuinely flaky connection still happens
      # once. Measured on run 32295312064, same outage, same minute: the bounded call took 58 s
      # where the unbounded one had taken 33+ minutes.
      - name: Bound apt's mirror retries (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo tee /etc/apt/apt.conf.d/99-ci-bounded-retries >/dev/null <<'CONF'
          Acquire::Retries "1";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::ForceIPv4 "true";
          CONF

      # exiftool is a runtime dependency of truestill-core (metadata extraction). Install it
      # per-OS so the tests that shell out to it can run. Tests that need it skip cleanly
      # when it is absent, but CI should exercise the real path on at least Linux/macOS.
      # Stopwatch around the fixed-cost step. Marker steps rather than timing inside the
      # install blocks: the Windows one is a guarded choco invocation and an instrument must
      # not put a hand on the thing it measures.
      - name: Timing mark (before exiftool)
        shell: bash
        run: echo "TS_EXIFTOOL_START=$(date +%s)" >> "$GITHUB_ENV"

      # No flags here: the bound is in the drop-in above, which this inherits along with every
      # other apt consumer in the job. `update` and `install` stay SPLIT rather than `&&`-joined -
      # chained, a flaky index refresh fails the step even when the package would have installed
      # from the lists already on the image.
      - name: Install exiftool (Linux)
        if: runner.os == 'Linux'
        # ⚠ A SECOND BOUND AT A DIFFERENT LAYER, AND BOTH ARE WANTED. `timeout(1)` bounds the
        # PROCESS; this bounds the STEP; `timeout-minutes` on the job bounds the LANE. Current
        # guidance is explicit that job and step timeouts belong together, and this workflow has
        # the evidence: the job bound has already fired twice in one day, which argues for
        # layering rather than against it.
        #
        # 15 = the step's own worst case with room: two `ci_bounded.sh` calls at 180 s x 2
        # attempts plus a 30 s pause each is ~13 min.
        #
        # ⚠ A STEP TIMEOUT CANNOT EXCEED ITS JOB'S - GitHub clamps it. 15 sits inside this job's
        # 20 and 45. The next person's numbers may not, and a silently clamped bound is worse
        # than none because it reads as set.
        timeout-minutes: 15
        run: |
          ./scripts/ci_bounded.sh 180 sudo apt-get update
          ./scripts/ci_bounded.sh 180 sudo apt-get install -y libimage-exiftool-perl
          # `(aeq)`: the bound above proves the install did not HANG; only running the binary
          # proves it is THERE. Linux had the bound and not the probe while Windows had the probe
          # and not the bound - two surfaces, each holding the half the other was missing.
          exiftool -ver
      # Guarded for the same reason the Windows step is, and it had NO guard at all until
      # `(aeq)`: a brew that half-succeeds is the twenty-unrelated-test-errors case with nothing
      # to catch it. No retry here - brew has not been observed to fail, and a retry written
      # against a failure nobody has seen is a guess (§4's fifty-second member).
      - name: Install exiftool (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: |
          brew install exiftool
          exiftool -ver
      # ⚠ THE RETRY IS KEYED ON THE GUARD, NOT ON THE EXIT CODE, AND THAT IS THE WHOLE DESIGN.
      # `(aeq)`: choco RETURNS 0 after a feed 503 (chocolatey/choco#1609, "Chocolatey reporting
      # success when install fails with 503 error"), so `$LASTEXITCODE` is not an observable here
      # any more than apt's status is on Linux. Measured 2026-08-21: two of three install attempts
      # in thirty minutes died on an identical `503 (Service Unavailable)` from
      # `community.chocolatey.org`, and the step's own error trace named line 3 - the probe - not
      # line 1. The probe is the only thing that knows, so the probe is what the loop asks.
      #
      # This is `ci_bounded.sh`'s shape with a different signal, deliberately NOT a port of it:
      # that script keys on exit 124 because apt swallows the status and DEADLOCKS, and its own
      # header says "we never see the 503". True of apt, false one lane over - which is the
      # premise `(aeq)` records as expired.
      #
      # Two attempts and a 30 s pause, matching `ci_bounded.sh`'s arithmetic and its reasoning:
      # the pause is NOT backoff, it is a wait for a server-side temporary failure that may still
      # be in force, and with two attempts there is one interval and nothing to be exponential
      # about. A sustained outage still fails, loudly, which is correct - this converts a coin
      # flip into a rare loss, never into a guarantee.
      #
      # NEVER SILENT: a swallowed 503 prints what was retried and why, so a green second attempt
      # cannot read as a clean first one.
      - name: Install exiftool (Windows)
        if: runner.os == 'Windows'
        # 15, matching Linux and inside this job's own bound. Two attempts plus a pause is well
        # under it; the bound is here to turn a hung feed into a failure with its logs intact
        # (§4's forty-third member) rather than to pace the retry.
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Continue'
          $installed = $false
          foreach ($attempt in 1..2) {
            choco install exiftool --no-progress
            # The probe IS the verdict. `Get-Command` rather than `$LASTEXITCODE` for the reason
            # in the comment above: choco's status cannot distinguish a 503 from a success.
            if (Get-Command exiftool -ErrorAction SilentlyContinue) { $installed = $true; break }
            if ($attempt -lt 2) {
              Write-Host "::warning::exiftool absent after choco attempt $attempt (the community feed 503s - chocolatey/choco#1609). Waiting 30s and retrying ONCE."
              Start-Sleep -Seconds 30
            }
          }
          if (-not $installed) {
            throw "exiftool is not callable after 2 choco attempts. The community feed is likely down - see BACKLOG (aeq)."
          }
          $ErrorActionPreference = 'Stop'
          exiftool -ver

      - name: Timing mark (after exiftool)
        shell: bash
        run: echo "TS_EXIFTOOL_END=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      # --locked fails the build if uv.lock is out of date with the pyproject files rather
      # than silently re-resolving. uv.lock is the single source of truth for what we ship,
      # so a lockfile that drifts from the manifests means CI stopped testing the real thing.
      - name: Sync workspace (lockfile must be current)
        run: uv sync --all-packages --group dev --locked

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        # --target-version py313: this repo does not adopt PEP 758. See pyproject.toml.
        run: uv run ruff format --check --target-version py313 .

      - name: Mypy
        run: uv run mypy packages/truestill-core/src/truestill_core packages/truestill-cli/src/truestill_cli packages/truestill-app/src/truestill_app scripts packaging conftest.py suite_scratch.py

      # The test trees, under `mypy-tests.toml` - a narrower setting than the fence above, and
      # that file carries the ruling. One run PER TREE: the four `conftest.py` files share a
      # module name and mypy refuses a single run that sees two of them.
      - name: Mypy (tests)
        shell: bash
        run: |
          for plat in linux win32; do
            for tree in packages/truestill-core/tests packages/truestill-cli/tests packages/truestill-app/tests tests/e2e; do
              uv run mypy --config-file mypy-tests.toml --platform "$plat" "$tree"
            done
          done

      # Windows Defender real-time scanning is ON by default on GitHub's Windows runners, and
      # this suite creates thousands of short-lived SQLite files and temp trees. Every one is
      # scanned on create and on close. Excluding the workspace and the temp directory is the
      # standard remedy and costs about a second.
      #
      # UNMEASURED AT THE TIME IT LANDED, and that is stated rather than implied: the Windows
      # pytest step has run 566 s, 1009 s, 1472 s and 596 s on four commits whose test counts
      # differ by under 2%. A 2.6x spread means a single run cannot tell this step's effect from
      # noise, so nobody should read one green run as proof it worked. What settles it is
      # TS_PYTEST_SECONDS across several runs, which the timing summary below already records.
      # If the median does not move, delete this step - an unmeasured optimisation that stays
      # forever is how a workflow accumulates cargo.
      # THE TEMP DIRECTORY IS ON THE WRONG DRIVE, and this is the larger of the two Windows
      # findings. Python's `tempfile` reads `TEMP`, which on these runners defaults to
      # `C:\Users\runneradmin\AppData\Local\Temp` - and GitHub's C: is the slow, read-optimised
      # volume while D: is fast local storage. pip measured 10-28% off an I/O-heavy Python suite
      # by moving `TEMP` to D: alone (sichard.ca/blog/2025/03/faster-pip-ci-on-windows-d-drive).
      #
      # This suite is I/O-heavy in exactly that way: measured on run 31795323999, Windows pytest
      # summed 1638 s against Ubuntu's 121 s - **13.5x** - while `Install exiftool`, fixed work
      # our code cannot touch, was only 1.8x. So it is not a slow machine. The per-file ratios
      # put the worst offenders in catalog and SQLite tests (trip_review 79x, clean_empty 70x,
      # catalog_statistics 66x), which is syscall cost rather than compute.
      #
      # ⚠ MEASURE IT ACROSS RUNS, NOT ONE. §5.1 records this lane at 405-1308 s over fourteen
      # runs on a near-constant suite; a 2.6x spread means one green run cannot tell this change
      # from noise. `TS_PYTEST_SECONDS` is already recorded per run - read the MEDIAN. If it does
      # not move, delete this step, on the same rule the Defender step below carries.
      - name: Put TEMP on the fast drive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path D:\Temp | Out-Null
          "TEMP=D:\Temp" >> $env:GITHUB_ENV
          "TMP=D:\Temp" >> $env:GITHUB_ENV

      # Recorded rather than asserted: the step above only helps if Python actually writes there.
      # `RUNNER_TEMP` and `TEMP` are different directories on this runner, which is how the
      # Defender exclusion below came to name one that pytest never used.
      - name: Where Python writes temp files (Windows)
        if: runner.os == 'Windows'
        shell: python
        run: |
          import tempfile
          print("tempfile.gettempdir() ->", tempfile.gettempdir())

      - name: Exclude the workspace from Defender (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
          # THE ONE PYTEST ACTUALLY USES. The two lines above exclude the workspace and
          # `RUNNER_TEMP`; `tempfile` reads `TEMP`, which is neither of those by default. An
          # exclusion aimed at a directory the workload never touches is an optimisation that
          # cannot work, and it read as done for as long as it was there.
          Add-MpPreference -ExclusionPath "$env:TEMP"

      - name: Pytest
        shell: bash
        run: |
          start=$(date +%s)
          status=0
          uv run pytest -n auto --junitxml=test-results.xml || status=$?
          echo "TS_PYTEST_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          exit $status

      # The junit file is the proof the suite RAN. A green step proves the code exited 0; pytest
      # exits 0 for a file that collected nothing. 3,498 tests on 2026-09-02; the floor is a
      # fraction, so a lane that silently collected half the suite fails too (P189, Q1213).
      - name: The suite actually ran
        if: always()
        shell: bash
        run: uv run python scripts/check_junit_floor.py --at-least 1000 test-results.xml

      # The same suite in a DIFFERENT collection order, because green in one order is not
      # green. `uv run pytest` uses testpaths (core, cli, app); passing the directory collects
      # alphabetically (app, cli, core). That difference alone was the whole reason a
      # shared-temporary-root leak stayed hidden: a test that CREATES the default catalog ran
      # after the test asserting it does not exist, so the suite passed by arrangement rather
      # than by isolation. `pytest packages/` is also just what a contributor types.
      #
      # Ubuntu only: running it on all three would triple the cost of a check whose answer
      # cannot differ by platform - the same reasoning as the ubuntu-only dependency audit below.
      #
      # NOT ON EVERY PUSH SINCE 2026-08-09, and the reason is measured. The line above used to
      # say this "costs nothing in wall-clock", because both passes took about the same time and
      # the ubuntu lane finished long before Windows either way. Parallelising the main suite
      # ended that: on run 31321298111 the main pass took **157 s** and this one **290 s**, making
      # the double-check nearly twice the cost of the thing it checks, and the largest single step
      # in the job. It stays serial - a parallel run has no order to be green in - so it moved
      # instead.
      #
      # What that trades, stated rather than glossed: order-dependence can now sit on main for up
      # to a day, and the nightly that finds it has several commits to choose from. Accepted
      # because the bug class it was written for is prevented by construction now - the root
      # conftest gives every test a data root no other test can name - so this is a backstop
      # rather than a live catch, and it guards a slow-moving class.
      #
      # `pull_request` is in the condition for completeness rather than coverage: this repo has
      # had exactly one PR ever and it was a throwaway CI experiment, so in practice this runs
      # nightly. Said plainly so nobody reads the condition as two independent safety nets.
      - name: Pytest (different collection order)
        if: >-
          runner.os == 'Linux' &&
          (github.event_name == 'schedule' || github.event_name == 'pull_request')
        run: uv run pytest packages/

      # See the E2E lane's copy for why this exists and why it is not a gate.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml
          # `error`, not `warn`: a missing proof is a failure, and a warning in a log nobody opens
          # is the same silence with extra steps (ENGINEERING_STANDARD.md §4, forty-third member).
          if-no-files-found: error
          retention-days: 30

      - name: Timing summary
        if: always()
        continue-on-error: true
        shell: bash
        env:
          TS_LANE: ${{ matrix.os }}
        run: uv run python scripts/ci_timing_summary.py

      # Audits the *locked* dependency set against the PyPI advisory database. Findings
      # block: a vulnerable dependency is a defect, not a warning. Accepting one is allowed
      # but must be explicit -- add `--ignore-vuln <ID>` below with a comment giving the
      # reason and the advisory link, so an accepted risk is always visible in review and
      # never silently inherited. See IMPLEMENTATION_STANDARDS.md §6.
      #
      # Ubuntu only: the audit reads a lockfile, not the installed tree, so the result is
      # identical on all three runners and there is no reason to hit the advisory API 3x.
      # Workspace members are local paths with no advisories, hence --no-emit-workspace.
      - name: Export locked dependencies for audit
        if: runner.os == 'Linux'
        run: uv export --format requirements-txt --no-emit-workspace -o requirements-audit.txt

      - name: pip-audit (locked dependencies)
        if: runner.os == 'Linux'
        run: uvx pip-audit -r requirements-audit.txt --disable-pip

  # Browser end-to-end, CHROMIUM AND WEBKIT on ubuntu. The 3-OS matrix above already owns OS
  # differences; this lane owns client-side truth.
  #
  # ⚠ THIS COMMENT SAID "chromium on ubuntu only ... a vanilla-JS app with no build step" and
  # both halves were false where it stood. The engine half was overturned by `(9cdd85d)`: WebKit
  # is what the Tauri shell renders in on Linux and macOS, so a chromium-only lane said nothing
  # about the shipped engine. The build half was overturned by the React seam - this job runs
  # `make frontend-install` below, and `make e2e` builds the bundle with Vite before a browser
  # opens. Recorded rather than edited away: the single-engine ruling was real and was reversed
  # on evidence, not on preference. A full browser x OS grid is still not run: the OS axis stays
  # the Python matrix's, and widening this one waits on a real cross-browser bug, not on a hunch.
  #
  # A separate job rather than a matrix entry so its failure is distinguishable at a glance,
  # and so a browser-layer problem never masks a Python one.
  # ════════════════════════════════════════════════════════════════════════════════════════════
  # ⚠ THE e2e JOB RUNS NIGHTLY AND ON DEMAND, NOT ON EVERY PUSH (re-decided 2026-08-22).
  # It was `if: false` from 2026-08-20 until then, on the condition *"returns with the first
  # migrated screen"* - and **that condition could not fire**, which is why this was re-decided
  # rather than waited out. `(adi)` is migrating by ISLAND, not by screen: `main.tsx` opens
  # *"The first React island: `#org-result`"*, a pure refactor inside one region of a
  # server-rendered page. There is no next state in which a whole screen becomes React and
  # somebody deletes an `if:`. Meanwhile the WHOLE LANE went dark for two days during which
  # `(aer)` and `(afo)` both changed wording it asserts on.
  # ⚠ This read "470 tests in 60 files" until 2026-08-22. The file half is checkable and was
  # WRONG: `git ls-tree -r --name-only 26aed42 tests/e2e/` - the disable commit - counts 58, the
  # same 58 as today. The test half is not recoverable without checking that tree out, so it is
  # dropped rather than replaced with a guess. What the sentence needed was "the whole lane",
  # which is the true claim and the one that cannot rot.
  #
  # WHY NOT EVERY PUSH. Measured 2026-08-22: **~23 pushes/day** on an active day, and this lane is
  # 21-25 min. That is 8+ hours of runner/day, and worse than the bill - `cancel-in-progress` is
  # true above, so at that cadence most runs would be CANCELLED mid-flight. A lane that usually
  # does not finish is §4's fifty-fourth member with a green tick beside it.
  #
  # WHY NOT A PATH FILTER. Because the blast radius is the PAYLOAD, not the markup, and there is a
  # two-day-old proof: `(afo)` (40589be) touched `truestill_core/cleanup.py`,
  # `truestill_app/service/clean_empty.py` and `cli.py` - **no `static/`, `templates/` or
  # `frontend/` path at all** - and changed the folder wording that
  # `tests/e2e/test_organize_on_the_pattern.py:245` and
  # `tests/e2e/test_unreadable_sources_are_visible.py:172` assert directly. A filter narrow enough
  # to be cheap would have skipped exactly that commit. The only SOUND filter is
  # `packages/*/src/**`, which fires on 38% of commits (23 of the last 60, measured) - most of the
  # cost, plus a filter that fails SILENTLY when it is wrong.
  #
  # ⚠ WHAT TURNS PER-PUSH BACK ON, AND THIS ONE CAN FIRE: **the lane finishing in under ~8
  # minutes.** That is a lever that exists today and is unused - `pytest-xdist` is already a
  # dependency and `make test` already runs `-n auto`, while `make e2e` is SERIAL across two
  # browsers. The suite is structurally parallel-safe: `app_server` is function-scoped on an
  # ephemeral port with its own catalog, and the one session-scoped fixture `retiring` documents
  # itself as holding *"no application state at all"*. Nobody has tried `-n auto` here. When it
  # runs in single-digit minutes, move this job back to `push` and delete this paragraph.
  #
  # ⚠ BEFORE A TAG, RUN IT. This lane is the only thing that sees the screens;
  # `workflow_dispatch` above is how, and `make e2e` is the local equivalent.
  #
  # ⚠ The second half of that reason expired and the rule did not, corrected 2026-09-03 (P205).
  # It read "The publish path has never fired and this lane is the only thing that sees the
  # screens"; the publish path has now fired three times - v0.0.0-rehearsal, v0.1.0 and v0.1.1.
  # THIS WAS THE FOURTH COPY OF THAT CLAIM AND THE LAST ONE FOUND: the P204 sweep that corrected
  # the other three (PROJECT_STATUS.md twice, IMPLEMENTATION_STANDARDS.md once) grepped only
  # `*.md`, so a claim living in a workflow comment outlived it by a commit. A sweep is only as
  # wide as its pathspec, and prose is not only in prose files.
  #
  # `(ajv)` is why the rule survives its own justification: this lane was green for nineteen days
  # over a bundle the published v0.1.0 never had, so running it before a tag is worth MORE now
  # that the publish path works, not less.
  #
  # ⚠ WHAT IS DELIBERATELY KEPT: the three `check` lanes above. They cost 1-3 minutes and are the
  # ONLY thing that sees Windows and macOS. On 2026-08-20 alone they caught `timeout(1)` not
  # existing on BSD and Windows being unable to execute a bash script; earlier, a `WindowsPath`
  # separator defect. **None was findable on the maintainer's machine.**
  #
  # ⚠ AND THE LOCAL RULE CHANGES WITH IT: `make check` before every commit, as before, and
  # `make gate` is NOT run for backend work. If a change genuinely reaches a screen, say so and
  # ask rather than running the browser lane by reflex. §4's fifty-fourth member is precisely
  # this hazard - an instrument that is not running is not an instrument reporting that nothing
  # is wrong. `make e2e` still runs the lane locally and is unchanged.
  # ════════════════════════════════════════════════════════════════════════════════════════════
  e2e:
    # Nightly and on demand. NOT on push - see the banner above for the measurement behind that.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: e2e (chromium + webkit, ubuntu)
    runs-on: ubuntu-latest
    # The browser lane runs ~24 min of real work and enforces its own 2000 s ceiling inside the
    # step. This is the outer bound for the case that ceiling cannot see: a hang before pytest
    # ever starts. 45 leaves the internal ceiling as the thing that reports a slow suite.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Same drop-in as the `check` job. It is repeated rather than shared because a composite
      # action for four lines is more machinery than the duplication costs - but it MUST be here
      # and must be before `Install browsers`, which is the call site that made this necessary:
      # `playwright install --with-deps` runs its own `apt-get` and inherits only what the config
      # says. `test_ci_bounds_apt_in_one_place` asserts every job that uses apt has one.
      - name: Bound apt's mirror retries (Linux)
        shell: bash
        run: |
          sudo tee /etc/apt/apt.conf.d/99-ci-bounded-retries >/dev/null <<'CONF'
          Acquire::Retries "1";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::ForceIPv4 "true";
          CONF

      - name: Install exiftool
        # Same reasoning as the `check` job's copy above, including the clamping note.
        timeout-minutes: 15
        run: |
          ./scripts/ci_bounded.sh 180 sudo apt-get update
          ./scripts/ci_bounded.sh 180 sudo apt-get install -y libimage-exiftool-perl
          # `(aeq)`: the bound above proves the install did not HANG; only running the binary
          # proves it is THERE. Linux had the bound and not the probe while Windows had the probe
          # and not the bound - two surfaces, each holding the half the other was missing.
          exiftool -ver

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # ⚠ 3.14, matching the `check` job: installing a version `requires-python` refuses would
      # fail at `uv sync` for a reason unrelated to whatever the run was testing.
      # ⚠ This read "even though this job is `if: false`. A disabled lane still has to be CORRECT
      # when the first migrated screen turns it back on" until 2026-08-22. The lane runs nightly,
      # so the version is exercised on every scheduled run rather than by whoever re-enabled it -
      # and the argument for pinning it got STRONGER, not weaker, when the job started running.
      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Sync workspace (lockfile must be current)
        run: uv sync --all-packages --group dev --locked

      # Browser binaries are ~114 MB and change only with the playwright version, so they are
      # cached on that version rather than re-downloaded every run.
      - name: Resolve playwright version
        id: pw
        # Guarded: a silently-empty version would still make a valid cache key, and that key
        # would never invalidate -- leaving a stale browser installed after an upgrade.
        # `shell: bash` turns pipefail on; the default `run:` shell does not, so the pipe below
        # read awk's status and only the `test -n` line caught a failed `playwright --version`.
        shell: bash
        run: |
          version="$(uv run playwright --version | awk '{print $NF}')"
          test -n "$version" || { echo "could not resolve the playwright version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install browsers
        # BOTH engines, matching `make e2e-install`. WebKit is what the Tauri shell renders in on
        # Linux and macOS, and a lane that is green only in Chromium says nothing about it.
        # 12 = 300 s x 2 attempts plus the 30 s pause, ~10.5 min, with room. Inside the job's 45.
        timeout-minutes: 12
        # 300 rather than the 180 the apt steps get: this ALSO unpacks two browsers, so its
        # honest work is minutes rather than a minute. `--with-deps` is what puts it under the
        # same apt deadlock, and it was the step that cost 43m33s on run 32295312064.
        run: ./scripts/ci_bounded.sh 300 uv run playwright install --with-deps chromium webkit

      # Node is pinned by `.nvmrc`, read here rather than restated: a version named in two places
      # is a version that disagrees with itself eventually. `engine-strict=true` in the frontend's
      # `.npmrc` turns a mismatch into a hard EBADENGINE rather than a warning nobody reads.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: packages/truestill-app/frontend/.nvmrc
          cache: npm
          cache-dependency-path: packages/truestill-app/frontend/package-lock.json

      - name: Install frontend dependencies
        run: make frontend-install

      # No retries, deliberately: a retry-until-green browser suite launders the very
      # nondeterminism this lane exists to expose. A flaky test is quarantined and filed.
      # THROUGH THE MAKEFILE, not a copy of its command. This step used to repeat the pytest
      # invocation, so when `make e2e` gained WebKit and a frontend build, CI kept running
      # neither and nothing said so. `E2E_EXTRA` exists for the one thing CI needs and local
      # runs do not.
      #
      # The ceiling is raised for CI hardware rather than removed: shared runners are slower and
      # far more variable than the machine the 1431s figure was measured on, and a ceiling that
      # fires on runner variance is one that gets deleted.
      # THE PREMISE EVERY TIMING NUMBER IN THIS LANE RESTS ON, printed every run rather than
      # probed once and written into a comment. `tests/e2e/conftest.py`'s 30 s assertion budget
      # ("longest wait 28.4 s" over three lanes) and the `-n auto` argument in the banner above
      # are both arguments about how much CPU this job has, and the conftest has said "a shared
      # 2-core runner" since 2026-08-15 - written once, never re-checked, and this repository has
      # been PUBLIC since before then, where GitHub's standard runner is not 2-core.
      #
      # Four lines, no dependency, no failure mode: it makes the hardware falsifiable from the
      # log of ANY run, which is the property a comment can never have. `(ago)`'s bar is met the
      # cheap way - this is not a guard that must earn itself, it is evidence the lane was not
      # recording.
      - name: Runner spec
        shell: bash
        run: |
          echo "nproc      = $(nproc)"
          echo "MemTotal   = $(awk '/MemTotal/{printf "%.1f GiB", $2/1048576}' /proc/meminfo)"
          echo "model name = $(awk -F': ' '/model name/{print $2; exit}' /proc/cpuinfo)"

      # `inputs.e2e_extra` is empty on schedule and on a plain dispatch, so this is the same
      # command it has always been unless somebody deliberately asked otherwise. It is appended
      # AFTER the junit flag so a measurement run still uploads its results.
      - name: E2E
        run: make e2e E2E_EXTRA="--junitxml=test-results.xml ${{ inputs.e2e_extra }}" E2E_SECONDS_MAX=3600

      # 510 browser tests on 2026-09-02; the floor is a fraction (P189, Q1213).
      - name: The lane actually ran
        if: always()
        shell: bash
        run: uv run python scripts/check_junit_floor.py --at-least 100 test-results.xml

      # WHICH tests failed, per run, so nobody has to count green runs by hand in a backlog
      # entry. `always()` because a green run's file is the baseline that makes a red one
      # readable, and it is a few KB. Read with `scripts/flake_report.py`, on demand - there is
      # deliberately no dashboard, no store and nothing here in the critical path.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-e2e
          path: test-results.xml
          if-no-files-found: error
          retention-days: 30

      # A red run should arrive with a replay, not a guess.
      #
      # `include-hidden-files` is required, not optional: `.artifacts` is a HIDDEN directory and
      # upload-artifact v4+ excludes hidden files by default (they often carry credentials).
      # Everything under this one is generated test output, so the default's reason does not
      # apply - but its effect did, and the step reported success while uploading nothing on
      # every run since the uploader went to v4. Every browser failure this project has
      # diagnosed was diagnosed without the replay §6 promises.
      #
      # `if-no-files-found: error` is the durable half. The bug was not that files were
      # excluded, it was that being excluded was SILENT: a green step is what lied. This step
      # only runs when the lane already failed, so a second failure costs nothing and a missing
      # replay stops being something you have to notice.
      - name: Upload traces and video from failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-artifacts
          path: tests/e2e/.artifacts
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
