name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly, for the collection-order pass only - see the step's own comment for the cost that
  # moved it here. 03:17 rather than on the hour: GitHub's scheduler queues heavily at :00.
  schedule:
    - cron: "17 3 * * *"

# The event is part of the group ON PURPOSE. Without it a scheduled run and a push to main share
# `refs/heads/main`, so the first morning push would cancel the nightly mid-flight - and the one
# thing the nightly exists to run is the one thing no other trigger runs. A guard that is
# silently cancelled is worse than one that was never scheduled, because the calendar says it ran.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # exiftool is a runtime dependency of truestill-core (metadata extraction). Install it
      # per-OS so the tests that shell out to it can run. Tests that need it skip cleanly
      # when it is absent, but CI should exercise the real path on at least Linux/macOS.
      # Stopwatch around the fixed-cost step. Marker steps rather than timing inside the
      # install blocks: the Windows one is a guarded choco invocation and an instrument must
      # not put a hand on the thing it measures.
      - name: Timing mark (before exiftool)
        shell: bash
        run: echo "TS_EXIFTOOL_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install exiftool (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
      - name: Install exiftool (macOS)
        if: runner.os == 'macOS'
        run: brew install exiftool
      # Guarded: choco can return 0 after a feed timeout, and a silently missing exiftool
      # surfaces minutes later as twenty unrelated-looking test errors instead of one clear
      # failure here. Verify the binary is actually callable before going further.
      - name: Install exiftool (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install exiftool --no-progress
          exiftool -ver

      - name: Timing mark (after exiftool)
        shell: bash
        run: echo "TS_EXIFTOOL_END=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.13
        run: uv python install 3.13

      # --locked fails the build if uv.lock is out of date with the pyproject files rather
      # than silently re-resolving. uv.lock is the single source of truth for what we ship,
      # so a lockfile that drifts from the manifests means CI stopped testing the real thing.
      - name: Sync workspace (lockfile must be current)
        run: uv sync --all-packages --group dev --locked

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy packages/truestill-core/src/truestill_core packages/truestill-cli/src/truestill_cli packages/truestill-app/src/truestill_app scripts packaging

      # Windows Defender real-time scanning is ON by default on GitHub's Windows runners, and
      # this suite creates thousands of short-lived SQLite files and temp trees. Every one is
      # scanned on create and on close. Excluding the workspace and the temp directory is the
      # standard remedy and costs about a second.
      #
      # UNMEASURED AT THE TIME IT LANDED, and that is stated rather than implied: the Windows
      # pytest step has run 566 s, 1009 s, 1472 s and 596 s on four commits whose test counts
      # differ by under 2%. A 2.6x spread means a single run cannot tell this step's effect from
      # noise, so nobody should read one green run as proof it worked. What settles it is
      # TS_PYTEST_SECONDS across several runs, which the timing summary below already records.
      # If the median does not move, delete this step - an unmeasured optimisation that stays
      # forever is how a workflow accumulates cargo.
      # THE TEMP DIRECTORY IS ON THE WRONG DRIVE, and this is the larger of the two Windows
      # findings. Python's `tempfile` reads `TEMP`, which on these runners defaults to
      # `C:\Users\runneradmin\AppData\Local\Temp` - and GitHub's C: is the slow, read-optimised
      # volume while D: is fast local storage. pip measured 10-28% off an I/O-heavy Python suite
      # by moving `TEMP` to D: alone (sichard.ca/blog/2025/03/faster-pip-ci-on-windows-d-drive).
      #
      # This suite is I/O-heavy in exactly that way: measured on run 31795323999, Windows pytest
      # summed 1638 s against Ubuntu's 121 s - **13.5x** - while `Install exiftool`, fixed work
      # our code cannot touch, was only 1.8x. So it is not a slow machine. The per-file ratios
      # put the worst offenders in catalog and SQLite tests (trip_review 79x, clean_empty 70x,
      # catalog_statistics 66x), which is syscall cost rather than compute.
      #
      # ⚠ MEASURE IT ACROSS RUNS, NOT ONE. §5.1 records this lane at 405-1308 s over fourteen
      # runs on a near-constant suite; a 2.6x spread means one green run cannot tell this change
      # from noise. `TS_PYTEST_SECONDS` is already recorded per run - read the MEDIAN. If it does
      # not move, delete this step, on the same rule the Defender step below carries.
      - name: Put TEMP on the fast drive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path D:\Temp | Out-Null
          "TEMP=D:\Temp" >> $env:GITHUB_ENV
          "TMP=D:\Temp" >> $env:GITHUB_ENV

      # Recorded rather than asserted: the step above only helps if Python actually writes there.
      # `RUNNER_TEMP` and `TEMP` are different directories on this runner, which is how the
      # Defender exclusion below came to name one that pytest never used.
      - name: Where Python writes temp files (Windows)
        if: runner.os == 'Windows'
        shell: python
        run: |
          import tempfile
          print("tempfile.gettempdir() ->", tempfile.gettempdir())

      - name: Exclude the workspace from Defender (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
          # THE ONE PYTEST ACTUALLY USES. The two lines above exclude the workspace and
          # `RUNNER_TEMP`; `tempfile` reads `TEMP`, which is neither of those by default. An
          # exclusion aimed at a directory the workload never touches is an optimisation that
          # cannot work, and it read as done for as long as it was there.
          Add-MpPreference -ExclusionPath "$env:TEMP"

      - name: Pytest
        shell: bash
        run: |
          start=$(date +%s)
          status=0
          uv run pytest -n auto --junitxml=test-results.xml || status=$?
          echo "TS_PYTEST_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          exit $status

      # The same suite in a DIFFERENT collection order, because green in one order is not
      # green. `uv run pytest` uses testpaths (core, cli, app); passing the directory collects
      # alphabetically (app, cli, core). That difference alone was the whole reason a
      # shared-temporary-root leak stayed hidden: a test that CREATES the default catalog ran
      # after the test asserting it does not exist, so the suite passed by arrangement rather
      # than by isolation. `pytest packages/` is also just what a contributor types.
      #
      # Ubuntu only: running it on all three would triple the cost of a check whose answer
      # cannot differ by platform - the same reasoning as the ubuntu-only dependency audit below.
      #
      # NOT ON EVERY PUSH SINCE 2026-08-09, and the reason is measured. The line above used to
      # say this "costs nothing in wall-clock", because both passes took about the same time and
      # the ubuntu lane finished long before Windows either way. Parallelising the main suite
      # ended that: on run 31321298111 the main pass took **157 s** and this one **290 s**, making
      # the double-check nearly twice the cost of the thing it checks, and the largest single step
      # in the job. It stays serial - a parallel run has no order to be green in - so it moved
      # instead.
      #
      # What that trades, stated rather than glossed: order-dependence can now sit on main for up
      # to a day, and the nightly that finds it has several commits to choose from. Accepted
      # because the bug class it was written for is prevented by construction now - the root
      # conftest gives every test a data root no other test can name - so this is a backstop
      # rather than a live catch, and it guards a slow-moving class.
      #
      # `pull_request` is in the condition for completeness rather than coverage: this repo has
      # had exactly one PR ever and it was a throwaway CI experiment, so in practice this runs
      # nightly. Said plainly so nobody reads the condition as two independent safety nets.
      - name: Pytest (different collection order)
        if: >-
          runner.os == 'Linux' &&
          (github.event_name == 'schedule' || github.event_name == 'pull_request')
        run: uv run pytest packages/

      # See the E2E lane's copy for why this exists and why it is not a gate.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Timing summary
        if: always()
        continue-on-error: true
        shell: bash
        env:
          TS_LANE: ${{ matrix.os }}
        run: uv run python scripts/ci_timing_summary.py

      # Audits the *locked* dependency set against the PyPI advisory database. Findings
      # block: a vulnerable dependency is a defect, not a warning. Accepting one is allowed
      # but must be explicit -- add `--ignore-vuln <ID>` below with a comment giving the
      # reason and the advisory link, so an accepted risk is always visible in review and
      # never silently inherited. See IMPLEMENTATION_STANDARDS.md §6.
      #
      # Ubuntu only: the audit reads a lockfile, not the installed tree, so the result is
      # identical on all three runners and there is no reason to hit the advisory API 3x.
      # Workspace members are local paths with no advisories, hence --no-emit-workspace.
      - name: Export locked dependencies for audit
        if: runner.os == 'Linux'
        run: uv export --format requirements-txt --no-emit-workspace -o requirements-audit.txt

      - name: pip-audit (locked dependencies)
        if: runner.os == 'Linux'
        run: uvx pip-audit -r requirements-audit.txt --disable-pip

  # Browser end-to-end, CHROMIUM AND WEBKIT on ubuntu. The 3-OS matrix above already owns OS
  # differences; this lane owns client-side truth.
  #
  # ⚠ THIS COMMENT SAID "chromium on ubuntu only ... a vanilla-JS app with no build step" and
  # both halves were false where it stood. The engine half was overturned by `(9cdd85d)`: WebKit
  # is what the Tauri shell renders in on Linux and macOS, so a chromium-only lane said nothing
  # about the shipped engine. The build half was overturned by the React seam - this job runs
  # `make frontend-install` below, and `make e2e` builds the bundle with Vite before a browser
  # opens. Recorded rather than edited away: the single-engine ruling was real and was reversed
  # on evidence, not on preference. A full browser x OS grid is still not run: the OS axis stays
  # the Python matrix's, and widening this one waits on a real cross-browser bug, not on a hunch.
  #
  # A separate job rather than a matrix entry so its failure is distinguishable at a glance,
  # and so a browser-layer problem never masks a Python one.
  e2e:
    name: e2e (chromium + webkit, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install exiftool
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Sync workspace (lockfile must be current)
        run: uv sync --all-packages --group dev --locked

      # Browser binaries are ~114 MB and change only with the playwright version, so they are
      # cached on that version rather than re-downloaded every run.
      - name: Resolve playwright version
        id: pw
        # Guarded: a silently-empty version would still make a valid cache key, and that key
        # would never invalidate -- leaving a stale browser installed after an upgrade.
        run: |
          version="$(uv run playwright --version | awk '{print $NF}')"
          test -n "$version" || { echo "could not resolve the playwright version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install browsers
        # BOTH engines, matching `make e2e-install`. WebKit is what the Tauri shell renders in on
        # Linux and macOS, and a lane that is green only in Chromium says nothing about it.
        run: uv run playwright install --with-deps chromium webkit

      # Node is pinned by `.nvmrc`, read here rather than restated: a version named in two places
      # is a version that disagrees with itself eventually. `engine-strict=true` in the frontend's
      # `.npmrc` turns a mismatch into a hard EBADENGINE rather than a warning nobody reads.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: packages/truestill-app/frontend/.nvmrc
          cache: npm
          cache-dependency-path: packages/truestill-app/frontend/package-lock.json

      - name: Install frontend dependencies
        run: make frontend-install

      # No retries, deliberately: a retry-until-green browser suite launders the very
      # nondeterminism this lane exists to expose. A flaky test is quarantined and filed.
      # THROUGH THE MAKEFILE, not a copy of its command. This step used to repeat the pytest
      # invocation, so when `make e2e` gained WebKit and a frontend build, CI kept running
      # neither and nothing said so. `E2E_EXTRA` exists for the one thing CI needs and local
      # runs do not.
      #
      # The ceiling is raised for CI hardware rather than removed: shared runners are slower and
      # far more variable than the machine the 1431s figure was measured on, and a ceiling that
      # fires on runner variance is one that gets deleted.
      - name: E2E
        run: make e2e E2E_EXTRA="--junitxml=test-results.xml" E2E_SECONDS_MAX=3600

      # WHICH tests failed, per run, so nobody has to count green runs by hand in a backlog
      # entry. `always()` because a green run's file is the baseline that makes a red one
      # readable, and it is a few KB. Read with `scripts/flake_report.py`, on demand - there is
      # deliberately no dashboard, no store and nothing here in the critical path.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-e2e
          path: test-results.xml
          if-no-files-found: warn
          retention-days: 30

      # A red run should arrive with a replay, not a guess.
      #
      # `include-hidden-files` is required, not optional: `.artifacts` is a HIDDEN directory and
      # upload-artifact v4+ excludes hidden files by default (they often carry credentials).
      # Everything under this one is generated test output, so the default's reason does not
      # apply - but its effect did, and the step reported success while uploading nothing on
      # every run since the uploader went to v4. Every browser failure this project has
      # diagnosed was diagnosed without the replay §6 promises.
      #
      # `if-no-files-found: error` is the durable half. The bug was not that files were
      # excluded, it was that being excluded was SILENT: a green step is what lied. This step
      # only runs when the lane already failed, so a second failure costs nothing and a missing
      # replay stops being something you have to notice.
      - name: Upload traces and video from failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-artifacts
          path: tests/e2e/.artifacts
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
