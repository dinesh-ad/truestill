name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # exiftool is a runtime dependency of truestill-core (metadata extraction). Install it
      # per-OS so the tests that shell out to it can run. Tests that need it skip cleanly
      # when it is absent, but CI should exercise the real path on at least Linux/macOS.
      - name: Install exiftool (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
      - name: Install exiftool (macOS)
        if: runner.os == 'macOS'
        run: brew install exiftool
      - name: Install exiftool (Windows)
        if: runner.os == 'Windows'
        run: choco install exiftool --no-progress

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Sync workspace
        run: uv sync --all-packages --group dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy packages/truestill-core/src/truestill_core packages/truestill-cli/src/truestill_cli packages/vaeon-app/src/vaeon_app

      - name: Pytest
        run: uv run pytest
