# ============================================================================================
# SCOPE FENCE - read before extending this file.
#
# This is a THROWAWAY MEASUREMENT job for BACKLOG (aad). Its entire purpose is to answer three
# questions that cannot be answered on Linux or in a console:
#
#   1. which binary-resolution rule fires under each bundler on Windows;
#   2. whether a genuinely windowed process skips the legacy-catalog probe;
#   3. whether CREATE_NO_WINDOW actually suppresses a console window.
#
# It is NOT the beginning of the release pipeline. Deliberately absent, and to stay absent:
# no signing, no notarization, no release upload, no tag trigger, no matrix, no caching of
# build outputs. `workflow_dispatch` only, so it never runs on a push and never costs a
# contributor a minute they did not ask for.
#
# DELETE OR REPURPOSE THIS FILE once the bundler is chosen. If you are here to add a platform,
# a signing step, or a release artifact, you are extending a measurement rig into a pipeline
# it was never designed to be - write the real one instead.
#
# ADDING A BUNDLER? TWO INDEPENDENT MEASUREMENTS MUST FAIL INDEPENDENTLY.
# The first version of this job sequenced both builds ahead of one measure step, so a Briefcase
# build failure discarded a perfectly good PyInstaller artifact and answered nothing about
# either. Every build is therefore `continue-on-error`, the measure step runs with
# `if: always()`, and a bundler whose build failed still gets a findings file SAYING SO - "no
# file" must never be ambiguous between "the build failed" and "the job never ran", because
# that ambiguity is exactly what cost the first run its PyInstaller answer.
#
# It is the same shape as this repo's guard rules: a step that reports FAILURE where it should
# report a FINDING. Sequence a third bundler the obvious way and you will reintroduce it.
# ============================================================================================
name: packaging throwaway (aad)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: measure (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install exiftool
        shell: pwsh
        run: |
          choco install exiftool --no-progress -y
          # The bundlers need a concrete file to embed, not a shim on PATH.
          $tool = (Get-Command exiftool.exe -ErrorAction SilentlyContinue).Source
          if (-not $tool) { $tool = (Get-ChildItem -Path 'C:\ProgramData\chocolatey' -Filter 'exiftool*.exe' -Recurse | Select-Object -First 1).FullName }
          if (-not $tool) { throw 'exiftool.exe not found after install' }
          "EXIFTOOL=$tool" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "exiftool: $tool"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Sync workspace
        run: uv sync --all-packages --group dev --locked

      # --- PyInstaller ------------------------------------------------------------------
      # Unmeasured on Windows: the Linux run told us about PyInstaller's LINUX layout only.
      - name: Build (PyInstaller)
        id: pyinstaller
        continue-on-error: true
        shell: pwsh
        run: |
          uv run pyinstaller --noconfirm --clean --noconsole `
            --name truestill-probe-pyinstaller `
            --add-binary "$env:EXIFTOOL;bin" `
            --paths packaging `
            packaging/truestill_probe/__main__.py

      # --- Briefcase --------------------------------------------------------------------
      # The venv executable directly, NOT `uv run`. `packaging/` contains its own
      # pyproject.toml - Briefcase requires a project root - and `uv run` from that directory
      # therefore treats it as a DIFFERENT project: it built a fresh empty .venv there and
      # reported `Failed to spawn: briefcase - program not found`, ignoring the workspace
      # environment the sync step had just filled. The "No requires-python value found in the
      # workspace" warning in that log is uv saying so.
      - name: Build (Briefcase)
        id: briefcase
        continue-on-error: true
        shell: pwsh
        working-directory: packaging
        run: |
          $briefcase = Join-Path $env:GITHUB_WORKSPACE '.venv\Scripts\briefcase.exe'
          if (-not (Test-Path $briefcase)) { throw "briefcase not found at $briefcase" }
          & $briefcase create windows app --no-input
          & $briefcase build windows app --no-input

      # Placed where the beside-the-executable rule would look, so the measurement reports
      # which rule fired rather than whether anyone remembered to copy a file.
      - name: Place exiftool beside the Briefcase executable
        id: briefcase_exiftool
        if: always()
        continue-on-error: true
        shell: pwsh
        working-directory: packaging
        run: |
          $exe = Get-ChildItem -Path build -Filter 'TruestillProbe.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'Briefcase executable not found' }
          $bin = Join-Path $exe.Directory.FullName 'bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Copy-Item $env:EXIFTOOL -Destination $bin
          "BRIEFCASE_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "briefcase exe: $($exe.FullName)"

      # `always()`: a bundler whose build failed still needs a findings file saying so.
      # Skipping here is what made "no file" ambiguous between a failed build and a job that
      # never ran, and that ambiguity cost the first run its PyInstaller answer.
      - name: Measure each artifact
        if: always()
        shell: pwsh
        env:
          PYINSTALLER_OUTCOME: ${{ steps.pyinstaller.outcome }}
          BRIEFCASE_OUTCOME: ${{ steps.briefcase.outcome }}
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path findings | Out-Null

          function Write-Findings {
            param([string]$Path, [hashtable]$Body)
            $Body | ConvertTo-Json -Depth 6 | Set-Content -Path $Path -Encoding utf8
          }

          function Measure-Artifact {
            param([string]$Name, [string]$Exe, [string]$BuildOutcome)

            $out = Join-Path $PWD "findings\$Name.json"

            # The build never produced anything. A finding, not a skip.
            if ($BuildOutcome -ne 'success') {
              Write-Host "::error::$Name BUILD FAILED - no artifact to measure (outcome: $BuildOutcome)"
              Write-Findings -Path $out -Body @{ artifact = $Name; measured = $false
                                                 reason = 'build failed'; build_outcome = $BuildOutcome }
              return
            }
            if ([string]::IsNullOrWhiteSpace($Exe) -or -not (Test-Path $Exe)) {
              Write-Host "::error::$Name ARTIFACT MISSING - the build reported success but produced no executable at '$Exe'"
              Write-Findings -Path $out -Body @{ artifact = $Name; measured = $false
                                                 reason = 'artifact missing'; expected_path = $Exe }
              return
            }

            # A working directory holding a legacy catalog, so the windowed process has
            # something to ignore. Without it the legacy question is inconclusive by design.
            $work = Join-Path $PWD "work-$Name"
            New-Item -ItemType Directory -Force -Path (Join-Path $work 'reports') | Out-Null
            Set-Content -Path (Join-Path $work 'reports\catalog.sqlite') -Value 'not a real catalog'

            $env:TRUESTILL_DATA_DIR = Join-Path $PWD "data-$Name"
            $env:TRUESTILL_CACHE_DIR = Join-Path $PWD "cache-$Name"

            # DETACHED, not `Start-Process`, and not `-WindowStyle Hidden` - hidden is not
            # detached. A GUI-subsystem process does not get a console ALLOCATED but still
            # INHERITS one from a parent that has it, and this runner's PowerShell owns a
            # console. The first run measured that inherited console and mis-scored Briefcase
            # as "has a console despite console_app = false". CREATE_NO_WINDOW would not do
            # either: it makes an INVISIBLE console, not no console. DETACHED_PROCESS (0x8) is
            # the one that means what a double-clicked shortcut gets.
            # .NET's ProcessStartInfo cannot set DETACHED_PROCESS, so the launch goes through
            # CreateProcess directly via a tiny helper. `Start-Process -WindowStyle Hidden`
            # would NOT do: hidden is not detached, and the console would still be inherited.
            $proc = & (Join-Path $env:GITHUB_WORKSPACE 'packaging\launch-detached.ps1') `
              -Exe $Exe -Arguments @('--probe', $out) -WorkingDirectory $work
            $deadline = (Get-Date).AddSeconds(180)
            while ((Get-Process -Id $proc -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 250
            }

            # ASSERTION 1. A windowed process that dies before writing produces no file, and the
            # job must say WHY rather than fail on a missing path.
            if (-not (Test-Path $out)) {
              Write-Host "::error::$Name assertion 1 FAILED - the process did not survive to write findings (exit code: $($proc.ExitCode))"
              Write-Findings -Path $out -Body @{ artifact = $Name; measured = $false
                                                 assertion_1 = 'fail'
                                                 reason = 'process did not survive to write findings'
                                                 exit_code = $proc.ExitCode }
              return
            }
            Write-Host "::group::$Name findings"
            Get-Content $out | Write-Host
            Write-Host "::endgroup::"
          }

          Measure-Artifact -Name 'pyinstaller' -BuildOutcome $env:PYINSTALLER_OUTCOME `
            -Exe (Join-Path $PWD 'dist\truestill-probe-pyinstaller\truestill-probe-pyinstaller.exe')
          Measure-Artifact -Name 'briefcase' -BuildOutcome $env:BRIEFCASE_OUTCOME `
            -Exe $env:BRIEFCASE_EXE

          # CONTROL, on the same principle as the probe's AttachConsole control: prove the
          # reporting mechanism works before trusting any verdict it gives. The
          # absent-artifact path had never executed - it was written for a case that had not
          # happened yet - so it is exercised deliberately here against a path that cannot
          # exist. If THIS file is missing, every other "no file" in this job is untrustworthy,
          # so the step fails rather than reporting measurements it cannot vouch for.
          Measure-Artifact -Name '_selfcheck' -BuildOutcome 'success' `
            -Exe (Join-Path $PWD 'no-such-artifact\does-not-exist.exe')
          if (-not (Test-Path (Join-Path $PWD 'findings\_selfcheck.json'))) {
            Write-Host '::error::the absent-artifact reporting path did NOT fire - a missing findings file cannot be trusted to mean anything in this run'
            exit 1
          }
          Write-Host 'control: the absent-artifact path fired and wrote a findings file'

      # Assertions 3 and 4 are checked from OUTSIDE the artifact: a windowed process cannot
      # report whether it served a page, and asking it to would test the reporter, not the app.
      - name: Assertions 3 and 4 - URL file and serving (PyInstaller)
        if: steps.pyinstaller.outcome == 'success'
        shell: pwsh
        continue-on-error: true
        run: |
          $data = Join-Path $PWD 'serve-data'
          $env:TRUESTILL_DATA_DIR = $data
          $env:TRUESTILL_CACHE_DIR = Join-Path $PWD 'serve-cache'
          $exe = Join-Path $PWD 'dist\truestill-probe-pyinstaller\truestill-probe-pyinstaller.exe'
          # Same detached launch as the measure step: a console inherited here would make the
          # serving check a different experiment from the one above.
          $pid_ = & (Join-Path $env:GITHUB_WORKSPACE 'packaging\launch-detached.ps1') `
            -Exe $exe -Arguments @('--port', '0', '--no-browser') -WorkingDirectory $PWD
          $urlFile = Join-Path $data 'session-url.txt'
          $deadline = (Get-Date).AddSeconds(90)
          while (-not (Test-Path $urlFile) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 200 }
          if (-not (Test-Path $urlFile)) {
            Write-Host '::error::assertion 3 FAILED - no session URL file was written'
          } else {
            $url = (Get-Content $urlFile)[0]
            Write-Host "assertion 3 PASS - $url"
            try {
              $res = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 30
              Write-Host "assertion 4 PASS - HTTP $($res.StatusCode), $($res.RawContentLength) bytes"
            } catch {
              Write-Host "::error::assertion 4 FAILED - $($_.Exception.Message)"
            }
          }
          Stop-Process -Id $pid_ -Force -ErrorAction SilentlyContinue

      # The raw JSON survives the job. Given how much of this work has been about green ticks
      # proving less than they appear to, the numbers are the deliverable, not the tick.
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packaging-findings
          path: findings/
          retention-days: 7
