# truestill workspace root (virtual: no [project] of its own).
# Members are the real packages under packages/*. Shared tooling config lives here so it
# applies uniformly across every member; each member's pyproject carries only its own
# [project] metadata and build config.

[tool.uv.workspace]
members = ["packages/*"]

# Development dependencies for the whole workspace. Usage: uv sync --all-packages --group dev
[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.2.0",
    "httpx>=0.28",       # Starlette TestClient (truestill-app tests)
    # Browser E2E (tests/e2e). The only tool that can execute the client-side JS layer, where
    # every UI bug the soak found actually lived -- a layer pytest alone cannot reach and
    # manual checking cannot regression-pin. Dev group only: it is never a runtime dependency
    # of truestill-core/-cli/-app, and a clean install of any of them pulls no browsers.
    "pytest-playwright>=0.5",
    # BUILD-ONLY bundlers for the (aad) packaging measurement. Dev group, never a runtime
    # dependency: they produce an artifact and are absent from it. Per the ruling of
    # 2026-07-31, a build tool that never enters the runtime graph does not carry the §4
    # written-justification burden a shipped dependency does - it ships to nobody, enters no
    # user's security surface, and is deleted with the job that uses it. Gated by
    # `tests/e2e/test_dependency_gating.py` so they cannot drift into a shipped package.
    "pyinstaller>=6.21",
    "briefcase>=0.4.4",
]

# --- Ruff (lint + format), applied repo-wide ------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "DTZ", "T10", "EM", "ISC", "ICN", "G",
    "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SIM", "ARG", "PTH", "ERA", "PGH",
    "PL", "TRY", "RUF",
]
ignore = ["E501"]  # Line too long - handled by formatter
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# CLI - stdout IS the output mechanism for the decision report
"packages/truestill-cli/src/truestill_cli/cli.py" = [
    "T201",    # print() is intentional here
    "PLR0913", # report/render helpers take many display flags
    "PLR0915", # argparse builder lists every subcommand flag in one place
    # _cmd_ingest refuses early and separately for each precondition - not a source, not a
    # directory, in-place without room, no media found. Each returns its own exit code with its
    # own message, which is the point: collapsing them would make one refusal stand for several.
    "PLR0911",
]
# Event review is CLI-facing: it prints prompts/tables to the terminal.
"packages/truestill-cli/src/truestill_cli/events_review.py" = [
    "T201",    # print()/input() are the interaction mechanism
    "PLR0913", # run_event_stage forwards resolutions/metadata/catalog/apply/prompt/template
]
# The event stage orchestrates several opt-in knobs (prompt, template) as keyword-only args.
"packages/truestill-core/src/truestill_core/event_review.py" = [
    "PLR0913", # run_event_stage(resolutions/metadata/catalog/apply/prompt/template)
]
# extract_archive_set takes four keyword-only opt-ins beyond its two positionals: a budget
# override for tests, an entry hook, and the progress/cancel pair every long job here carries.
# Bundling them into an options object would hide the pair that the job machinery expects.
"packages/truestill-core/src/truestill_core/archive_extract.py" = [
    "PLR0913", # extract_archive_set(set/destination + budget/on_entry/progress/cancel)
]
# Event clustering exposes several tunables as keyword-only knobs.
"packages/truestill-core/src/truestill_core/events.py" = [
    "PLR0913", # cluster_camera(sensitivity/window/min_files/min_duration/gps_jump)
]
# Catalog - a persisted row has many columns; keyword-only args name them at the call site
"packages/truestill-core/src/truestill_core/catalog.py" = [
    "PLR0913", # record_uploaded mirrors the table columns
]
# Organizer - execute() coordinates several opt-in behaviours via keyword-only flags
"packages/truestill-core/src/truestill_core/organizer.py" = [
    "PLR0913", # execute() and its write-path helpers take many keyword-only opt-in flags
]
# scan.compute_hashes / verify.verify_copies expose pool/workers/progress/cancel as kw-only.
"packages/truestill-core/src/truestill_core/scan.py" = ["PLR0913"]
"packages/truestill-core/src/truestill_core/verify.py" = ["PLR0913"]
# organize_preview / organize_run forward progress/cancel/refresh_metadata as keyword-only knobs.
"packages/truestill-app/src/truestill_app/service/organize.py" = ["PLR0913"]
# Same shape one module over: _resolve_migration_routes forwards cache/progress/cancel as
# keyword-only knobs (cache added for F18's warm-read fix).
"packages/truestill-app/src/truestill_app/service/migrate.py" = ["PLR0913"]
# run_migration(catalog/destination/drive_uuid/template/apply/progress/cancel) as kw-only knobs.
"packages/truestill-core/src/truestill_core/migrate.py" = ["PLR0913"]
# create_app is an application factory: each route is a nested handler closing over the token/db.
"packages/truestill-app/src/truestill_app/server.py" = [
    "PLR0915", # the route handlers are defined inline inside the factory, by design
]
# Date parsing - EXIF timestamps are local wall-clock with no zone; naive datetimes correct.
"packages/truestill-core/src/truestill_core/dates.py" = [
    "DTZ007",  # strptime without %z is deliberate; EXIF has no reliable zone
    "PLR0911", # resolve_capture_datetime is a priority chain of early returns, by design
]
# Video UTC ladder - same naive wall-clock policy as dates.py; duration parser is shape-branchy.
"packages/truestill-core/src/truestill_core/video_utc.py" = [
    "DTZ007",  # device/GPS stamps are naive local or UTC digits without a zone field
    "PLR0911", # parse_duration branches on exiftool's several Duration shapes
]
# Destination backends shell out to rclone; that is the whole point of the wrapper.
"packages/truestill-core/src/truestill_core/destinations/rclone.py" = [
    "S603", # subprocess call is intentional
    "S607", # rclone is resolved from PATH by design
]
# Standalone benchmark/utility scripts: print is the output, and they bootstrap sys.path.
"scripts/**/*.py" = [
    "T201", "E402", "S311", "S603", "PLR2004", "DTZ001",
]
# Tests can be more permissive
"packages/*/tests/**/*.py" = [
    "S101",    # Assert allowed in tests
    "PLR2004", # Magic values acceptable in tests
    "PLR0913", # Test helpers may take several args
    "PLR0917", # ... including positional
    "T201",    # Print statements allowed in tests
    "DTZ001",  # Naive datetimes are the subject under test (see dates.py rationale)
]
# Browser end-to-end suite. Same latitude as the other tests, plus the two it needs of its own.
"tests/e2e/**/*.py" = [
    "S101",    # Assert allowed in tests
    "PLR2004", # Fixture sizes (8 photos, 400 files) read better inline than as constants
    "PLR0913",
    "T201",
    "S603",    # subprocess: exiftool on generated fixtures, and `uv export` in the dep gate
    "S607",    # ... invoked by name, from PATH, exactly as the app itself does
]
# Measurement script: one instrumented pipeline pass, deliberately verbose.
"scripts/profile_organize_preview.py" = [
    "PLR0913",
    "PLR0915",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# --- pytest ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = [
    "packages/truestill-core/tests",
    "packages/truestill-cli/tests",
    "packages/truestill-app/tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

# --- mypy -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
# Resolve workspace packages from source rather than from an installed copy, so mypy gives the
# same answer in an isolated pre-commit env as it does under `uv run`. Without this, the
# pre-commit hook cannot see `truestill_core` at all -- and its upstream default args include
# `--ignore-missing-imports`, so it answered "fine" to an import of a module that had not
# existed for two renames. Overriding those args (below) is only safe because of this line.
mypy_path = "packages/truestill-core/src:packages/truestill-cli/src:packages/truestill-app/src:packaging"
# ENGINEERING_STANDARD.md §4: mypy strict is mandatory. The gate and the claim must agree.
strict = true

# imagehash ships no type stubs; Pillow's are partial; pillow-heif and send2trash ship none.
# send2trash is an OPTIONAL runtime probe (see cleanup.trash_backend), not a dependency.
[[tool.mypy.overrides]]
module = ["imagehash", "PIL", "PIL.*", "pillow_heif", "send2trash"]
ignore_missing_imports = true
