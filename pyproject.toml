# vaeon workspace root (virtual: no [project] of its own).
# Members are the real packages under packages/*. Shared tooling config lives here so it
# applies uniformly across every member; each member's pyproject carries only its own
# [project] metadata and build config.

[tool.uv.workspace]
members = ["packages/*"]

# Development dependencies for the whole workspace. Usage: uv sync --all-packages --group dev
[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.2.0",
    "httpx>=0.28",       # Starlette TestClient (truestill-app tests)
]

# --- Ruff (lint + format), applied repo-wide ------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "DTZ", "T10", "EM", "ISC", "ICN", "G",
    "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SIM", "ARG", "PTH", "ERA", "PGH",
    "PL", "TRY", "RUF",
]
ignore = ["E501"]  # Line too long - handled by formatter
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# CLI - stdout IS the output mechanism for the decision report
"packages/truestill-cli/src/truestill_cli/cli.py" = [
    "T201",    # print() is intentional here
    "PLR0913", # report/render helpers take many display flags
]
# Event review is CLI-facing: it prints prompts/tables to the terminal.
"packages/truestill-cli/src/truestill_cli/events_review.py" = [
    "T201",    # print()/input() are the interaction mechanism
    "PLR0913", # run_event_stage forwards resolutions/metadata/catalog/apply/prompt/template
]
# The event stage orchestrates several opt-in knobs (prompt, template) as keyword-only args.
"packages/truestill-core/src/truestill_core/event_review.py" = [
    "PLR0913", # run_event_stage(resolutions/metadata/catalog/apply/prompt/template)
]
# Event clustering exposes several tunables as keyword-only knobs.
"packages/truestill-core/src/truestill_core/events.py" = [
    "PLR0913", # cluster_camera(sensitivity/window/min_files/min_duration/gps_jump)
]
# Catalog - a persisted row has many columns; keyword-only args name them at the call site
"packages/truestill-core/src/truestill_core/catalog.py" = [
    "PLR0913", # record_uploaded mirrors the table columns
]
# Organizer - execute() coordinates several opt-in behaviours via keyword-only flags
"packages/truestill-core/src/truestill_core/organizer.py" = [
    "PLR0913", # execute(): apply/set_timestamps/skip_undated/event_ids/ingest/drive_uuid/...
    "PLR0912", # execute() branches over dup/dry-run/skip-undated/write/rename/near-dup outcomes
    "PLR0915", # execute() coordinates the whole per-file write path in one loop
]
# scan.compute_hashes / verify.verify_copies expose pool/workers/progress/cancel as kw-only.
"packages/truestill-core/src/truestill_core/scan.py" = ["PLR0913"]
"packages/truestill-core/src/truestill_core/verify.py" = ["PLR0913"]
# run_migration(catalog/destination/drive_uuid/template/apply/progress/cancel) as kw-only knobs.
"packages/truestill-core/src/truestill_core/migrate.py" = ["PLR0913"]
# create_app is an application factory: each route is a nested handler closing over the token/db.
"packages/truestill-app/src/truestill_app/server.py" = [
    "PLR0915", # the route handlers are defined inline inside the factory, by design
]
# Date parsing - EXIF timestamps are local wall-clock with no zone; naive datetimes correct.
"packages/truestill-core/src/truestill_core/dates.py" = [
    "DTZ007",  # strptime without %z is deliberate; EXIF has no reliable zone
    "PLR0911", # resolve_capture_datetime is a priority chain of early returns, by design
]
# Destination backends shell out to rclone; that is the whole point of the wrapper.
"packages/truestill-core/src/truestill_core/destinations/rclone.py" = [
    "S603", # subprocess call is intentional
    "S607", # rclone is resolved from PATH by design
]
# Standalone benchmark/utility scripts: print is the output, and they bootstrap sys.path.
"scripts/**/*.py" = [
    "T201", "E402", "S311", "S603", "PLR2004", "DTZ001",
]
# Tests can be more permissive
"packages/*/tests/**/*.py" = [
    "S101",    # Assert allowed in tests
    "PLR2004", # Magic values acceptable in tests
    "PLR0913", # Test helpers may take several args
    "PLR0917", # ... including positional
    "T201",    # Print statements allowed in tests
    "DTZ001",  # Naive datetimes are the subject under test (see dates.py rationale)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# --- pytest ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = [
    "packages/truestill-core/tests",
    "packages/truestill-cli/tests",
    "packages/truestill-app/tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

# --- mypy -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# imagehash ships no type stubs; Pillow's are partial; pillow-heif ships none. Not worth failing on.
[[tool.mypy.overrides]]
module = ["imagehash", "PIL", "PIL.*", "pillow_heif"]
ignore_missing_imports = true
