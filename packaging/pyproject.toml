# Briefcase project for the (aad) THROWAWAY measurement build. Not a release configuration.
# See ../.github/workflows/packaging-throwaway.yml for the scope fence.
#
# The three metadata items below are not optional decoration: Briefcase's linux/windows targets
# refuse to build without a PEP 639 `license` (not `license.text`), an actual licence FILE via
# `license-files`, and a CHANGELOG with a recognised name. Three failed builds on Linux
# established that, so they are written down rather than rediscovered.
[tool.briefcase]
project_name = "TruestillProbe"
bundle = "app.truestill"
version = "0.0.1"
license = "Apache-2.0"
license-files = ["LICENSE"]
author = "truestill"
author_email = "noreply@truestill.invalid"
url = "https://github.com/dinesh-ad/truestill"

[tool.briefcase.app.truestill_probe]
formal_name = "TruestillProbe"
description = "Throwaway packaging measurement probe for (aad)"
sources = ["truestill_probe"]
requires = [
    "../packages/truestill-core",
    "../packages/truestill-app",
]

[tool.briefcase.app.truestill_probe.windows]
[tool.briefcase.app.truestill_probe.windows.app]
# Windowed on purpose: a console build would answer neither Windows question, because both are
# about what happens when there is no console.
console_app = false

[tool.briefcase.app.truestill_probe.linux]
[tool.briefcase.app.truestill_probe.linux.system]
